name: 'Post PR Comments'
description: >
  Post inline pull-request review comments to a Forgejo (or Gitea) PR,
  driven by a JSON file of items and a message template. Generic —
  no assumptions about linters, reviewdog, or any particular tool.

inputs:
  items-file:
    description: >
      Path to a JSON file containing an array of items, one per comment.
      Each item can be any nested shape (e.g.
      [{"location": {"file": "src/app.py", "range": {"start": {"line": 42}}},
      "message": "..."}]) -- path-field/line-field say where to find the
      position, and the rest is available to the message template.
    required: true

  message-template-file:
    description: >
      Path to a file containing the template for each comment body.
      Placeholders use a small dotted/indexed path syntax that reaches
      into nested JSON, e.g. "{message}", "{location.file}",
      "{range.start.line}", "{tags[0]}". A placeholder that doesn't
      resolve for a given item is left as literal text rather than
      failing the run, so one template can tolerate items of varying
      shape.
    required: true

  path-field:
    description: >
      Dotted/indexed path into each item for the file path the comment
      attaches to, e.g. "path" or "location.file".
    required: false
    default: 'location.file'

  line-field:
    description: >
      Dotted/indexed path into each item for the 1-based line number the
      comment attaches to, e.g. "line" or "range.start.line". This is
      the one fixed lookup every item must resolve, however the rest of
      the item's JSON is shaped.
    required: false
    default: 'range.start.line'

  review-body:
    description: >
      Template for the top-level review summary comment. Supports a
      {count} placeholder for the number of comments being posted. Set
      to '' (empty) to skip the top-level comment entirely and post only
      the inline per-item comments.
    required: false
    default: '🤖 **Automated comments**\n\nPosting {count} comment(s).'

  dedupe:
    description: 'Drop duplicate (path, line, rendered body) comments before posting.'
    required: false
    default: 'true'

  fail-on-comments:
    description: 'If true, the action exits non-zero when one or more comments are posted.'
    required: false
    default: 'false'

  api-url:
    description: >
      Base URL of the Forgejo/Gitea API, e.g. https://forgejo.example.com/api/v1.
      Defaults to the runner-provided API URL for the current instance.
    required: false
    default: ${{ github.api_url }}

  owner:
    description: >
      Repository owner/organization. Defaults to the current repository's
      owner.
    required: false
    default: ${{ github.repository_owner }}

  repo:
    description: >
      Repository name. Defaults to the current repository's name.
    required: false
    default: ${{ github.event.repository.name }}

  pr-number:
    description: >
      Pull request number. Defaults to the number of the pull request
      that triggered this workflow.
    required: false
    default: ${{ github.event.pull_request.number }}

  head-sha:
    description: >
      Commit SHA the review should be attached to. Defaults to the head
      commit of the pull request that triggered this workflow.
    required: false
    default: ${{ github.event.pull_request.head.sha }}

  token:
    description: >
      Token used to post pull-request review comments. Defaults to the
      Forgejo-provided GitHub-compatible workflow token; override with a
      PAT if the default token lacks permission to create reviews.
    required: false
    default: ${{ github.token }}

outputs:
  comments-posted:
    description: 'Number of inline comments posted.'
    value: ${{ steps.post.outputs.comments-posted }}

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: ${{ github.action_repository }}/setup-python@${{ github.action_ref }}
      with:
        python_version: ${{ inputs.python-version }}

    - name: Post PR comments
      id: post
      shell: bash
      env:
        ITEMS_FILE: ${{ inputs.items-file }}
        MESSAGE_TEMPLATE_FILE: ${{ inputs.message-template-file }}
        PATH_FIELD: ${{ inputs.path-field }}
        LINE_FIELD: ${{ inputs.line-field }}
        REVIEW_BODY: ${{ inputs.review-body }}
        DEDUPE: ${{ inputs.dedupe }}
        FAIL_ON_COMMENTS: ${{ inputs.fail-on-comments }}
        # These five all have ${{ github.* }} defaults above, populated
        # automatically for a pull_request-triggered job. The script does
        # no further auto-detection -- override explicitly for other
        # trigger types.
        API_URL: ${{ inputs.api-url }}
        OWNER: ${{ inputs.owner }}
        REPO: ${{ inputs.repo }}
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_SHA: ${{ inputs.head-sha }}
        # TOKEN defaults to ${{ github.token }} above, populated
        # automatically.
        TOKEN: ${{ inputs.token }}
      run: python3 "${{ github.action_path }}/scripts/post-pr-comments.py"