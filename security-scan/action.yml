name: Security Scan
description: Run secrets and dependency vulnerability scans using Gitleaks and Trivy

inputs:
  trivy_version:
    description: Trivy version to install. Defaults to the latest release.
    required: false
    default: latest

  trivy_install_dir:
    description: Directory to install the Trivy binary into.
    required: false
    default: /usr/local/bin

  pkg_cache:
    description: Package cache host or base URL to mirror GitHub releases through.
    required: false
    default: ""

  gitleaks_version:
    description: Gitleaks version to install. Defaults to the latest release.
    required: false
    default: latest

  gitleaks_install_dir:
    description: Directory to install the Gitleaks binary into.
    required: false
    default: /usr/local/bin

  scan_path:
    description: Path to scan.
    required: false
    default: .

  severity:
    description: Trivy severities to report.
    required: false
    default: HIGH,CRITICAL

  ignore_unfixed:
    description: Ignore vulnerabilities that do not have a fixed version.
    required: false
    default: "true"

  fail_on_secrets:
    description: Fail the action when Gitleaks detects secrets.
    required: false
    default: "true"

  fail_on_vulnerabilities:
    description: Fail the action when Trivy detects vulnerabilities.
    required: false
    default: "true"

  post_pr_comment:
    description: Post (or update) a pull request comment summarizing the scan results.
    required: false
    default: "true"

outputs:
  trivy_version:
    description: The Trivy version that was installed.
    value: ${{ steps.setup-trivy.outputs.version }}

  gitleaks_version:
    description: The Gitleaks version that was installed.
    value: ${{ steps.setup-gitleaks.outputs.version }}

runs:
  using: composite

  steps:

    # ============================================================
    # Install dependencies
    # ============================================================
    - name: Install scan dependencies
      shell: bash
      run: |
        set -euo pipefail

        echo "============================================================"
        echo "Preparing security scan dependencies"
        echo "============================================================"

        for dep in curl tar jq; do
          if command -v "${dep}" >/dev/null 2>&1; then
            echo "${dep} is already installed."
            continue
          fi

          echo "Installing missing dependency: ${dep}"

          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache "${dep}"

          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq "${dep}"

          elif command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm "${dep}"

          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y "${dep}"

          elif command -v yum >/dev/null 2>&1; then
            yum install -y "${dep}"

          else
            echo "::error::Unable to install ${dep}."
            echo "::error::No supported package manager found."
            exit 1
          fi
        done

        echo "Security scan dependencies are ready."

    # ============================================================
    # Secrets scan
    #
    # Delegates to the shared run-secrets-scan action instead of
    # inlining Gitleaks invocation/report-parsing here.
    # ============================================================
    - id: secrets-scan
      name: Secrets scan
      uses: ${{ github.action_path }}/../run-secrets-scan
      with:
        scan_path: ${{ inputs.scan_path }}
        gitleaks_version: ${{ inputs.gitleaks_version }}
        gitleaks_install_dir: ${{ inputs.gitleaks_install_dir }}
        pkg_cache: ${{ inputs.pkg_cache }}

    # ============================================================
    # Dependency / vulnerability scan
    #
    # Delegates to the shared run-vulnerability-scan action instead
    # of inlining Trivy invocation/report-parsing here.
    # ============================================================
    - id: dependency-scan
      name: Dependency vulnerability scan
      uses: ${{ github.action_path }}/../run-vulnerability-scan
      with:
        scan_type: fs
        target: ${{ inputs.scan_path }}
        severity: ${{ inputs.severity }}
        ignore_unfixed: ${{ inputs.ignore_unfixed }}
        trivy_version: ${{ inputs.trivy_version }}
        trivy_install_dir: ${{ inputs.trivy_install_dir }}
        pkg_cache: ${{ inputs.pkg_cache }}

    # ============================================================
    # Security summary
    # ============================================================
    - id: security-summary
      name: Security scan summary
      if: always()
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.scan_path }}
        FAIL_ON_SECRETS: ${{ inputs.fail_on_secrets }}
        FAIL_ON_VULNERABILITIES: ${{ inputs.fail_on_vulnerabilities }}
        GITLEAKS_REPORT: ${{ steps.secrets-scan.outputs.report }}
        SECRET_COUNT: ${{ steps.secrets-scan.outputs.secret_count }}
        GITLEAKS_SCAN_ERROR: ${{ steps.secrets-scan.outputs.scan_error }}
        TRIVY_REPORT: ${{ steps.dependency-scan.outputs.report }}
        VULNERABILITY_COUNT: ${{ steps.dependency-scan.outputs.vulnerability_count }}
        TRIVY_SCAN_ERROR: ${{ steps.dependency-scan.outputs.scan_error }}
      run: |
        set -uo pipefail

        SUMMARY="${RUNNER_TEMP}/security-summary.md"

        # Counts and report paths come directly from the scan actions'
        # outputs above - no need to re-derive or re-parse them here.
        SECRET_COUNT="${SECRET_COUNT:-0}"
        VULNERABILITY_COUNT="${VULNERABILITY_COUNT:-0}"

        TOTAL_COUNT=$((SECRET_COUNT + VULNERABILITY_COUNT))

        # ----------------------------------------------------------
        # Create summary
        # ----------------------------------------------------------
        {
          echo "<!-- security-scan-summary -->"
          echo "## 🔐 Security Scan Summary"
          echo ""

          if [ -n "${SCAN_PATH}" ] && [ "${SCAN_PATH}" != "." ]; then
          echo "**Scan path:** \`${SCAN_PATH}\`"
          echo ""
          fi

          if [[ "${GITLEAKS_SCAN_ERROR}" == "true" ]]; then
            echo "> ⚠️ Gitleaks did not complete successfully - the secret count below may be incomplete."
            echo ""
          fi

          if [[ "${TRIVY_SCAN_ERROR}" == "true" ]]; then
            echo "> ⚠️ Trivy did not complete successfully - the vulnerability count below may be incomplete."
            echo ""
          fi

          echo "| Scanner | Severity | Issue | Location | Package | Installed | Fixed |"
          echo "|---|---|---|---|---|---|---|"
        } > "${SUMMARY}"

        # ----------------------------------------------------------
        # Add Gitleaks findings
        #
        # IMPORTANT:
        # We intentionally do NOT include Secret in the output.
        # This prevents credentials from appearing in the Actions
        # summary or logs.
        # ----------------------------------------------------------
        if [[ "${SECRET_COUNT}" -gt 0 ]]; then
          jq -r '
            .[] |
            [
              "| Gitleaks",
              "HIGH",
              ("Secret detected: " + (.RuleID // "unknown")),
              ((.File // "unknown") + ":" + ((.StartLine // 0) | tostring)),
              "—",
              "—",
              "— |"
            ] |
            join(" | ")
          ' "${GITLEAKS_REPORT}" >> "${SUMMARY}"
        fi

        # ----------------------------------------------------------
        # Add Trivy findings
        # ----------------------------------------------------------
        if [[ "${VULNERABILITY_COUNT}" -gt 0 ]]; then
          jq -r '
            .Results[]? |
            .Target as $target |
            .Vulnerabilities[]? |
            [
              "| Trivy",
              (.Severity // "UNKNOWN"),
              (
                (.VulnerabilityID // "UNKNOWN") +
                ": " +
                (.Title // "Vulnerability")
              ),
              ($target // "unknown"),
              (.PkgName // "unknown"),
              (.InstalledVersion // "unknown"),
              (.FixedVersion // "—") + " |"
            ] |
            join(" | ")
          ' "${TRIVY_REPORT}" >> "${SUMMARY}"
        fi

        # ----------------------------------------------------------
        # No findings
        # ----------------------------------------------------------
        if [[ "${TOTAL_COUNT}" -eq 0 ]]; then
          echo "| — | — | No security issues detected | — | — | — | — |" >> "${SUMMARY}"
        fi

        # ----------------------------------------------------------
        # Summary statistics
        # ----------------------------------------------------------
        {
          echo ""
          echo "### Summary"
          echo ""
          echo "| Metric | Count |"
          echo "|---|---:|"
          echo "| Secrets | ${SECRET_COUNT} |"
          echo "| Vulnerabilities | ${VULNERABILITY_COUNT} |"
          echo "| **Total issues** | **${TOTAL_COUNT}** |"
        } >> "${SUMMARY}"

        # ----------------------------------------------------------
        # Write to GitHub Actions summary
        # ----------------------------------------------------------
        cat "${SUMMARY}" >> "${GITHUB_STEP_SUMMARY}"

        # ----------------------------------------------------------
        # Also print to logs
        # ----------------------------------------------------------
        echo ""
        echo "============================================================"
        echo "Security Scan Summary"
        echo "============================================================"

        cat "${SUMMARY}"

        echo ""
        echo "============================================================"

        # ----------------------------------------------------------
        # Fail after the report has been generated
        # ----------------------------------------------------------
        FAILED=0

        if [[ "${GITLEAKS_SCAN_ERROR}" == "true" || "${TRIVY_SCAN_ERROR}" == "true" ]]; then
          echo "::error::One or more scanners failed to complete; treating this as a failed security scan."
          FAILED=1
        fi

        if [[ "${FAIL_ON_SECRETS}" == "true" &&
              "${SECRET_COUNT}" -gt 0 ]]; then

          echo "::error::Secrets scan failed: ${SECRET_COUNT} secret(s) detected."
          FAILED=1
        fi

        if [[ "${FAIL_ON_VULNERABILITIES}" == "true" &&
              "${VULNERABILITY_COUNT}" -gt 0 ]]; then

          echo "::error::Dependency scan failed: ${VULNERABILITY_COUNT} vulnerability/vulnerabilities detected."
          FAILED=1
        fi

        if [[ "${FAILED}" -ne 0 ]]; then
          echo "::error::Security scan failed."
          exit 1
        fi

        echo "Security scan passed."

    # ============================================================
    # Pull request comment
    #
    # Delegates to the shared, generic post-comment action rather
    # than inlining Forgejo API calls here. The marker keeps this to
    # a single upserted comment per PR instead of one per run.
    # ============================================================
    - name: Comment security scan summary on pull request
      if: always() && inputs.post_pr_comment == 'true'
      uses: ${{ github.action_path }}/../post-comment
      with:
        body_path: ${{ runner.temp }}/security-summary.md
        marker: "<!-- security-scan-summary -->"