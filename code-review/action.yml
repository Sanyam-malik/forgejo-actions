name: 'Multi-language Code Review'

description: >
  Detects programming languages in a repository, runs open-source linters
  through reviewdog, optionally generates AI descriptions and suggestions
  using an OpenAI-compatible endpoint, and posts findings as inline comments
  on Forgejo pull requests.

inputs:
  token:
    description: >
      Token used to post pull-request review comments.
      Defaults to the Forgejo-provided GitHub-compatible workflow token.
    required: false
    default: ${{ github.token }}

  pkg_cache:
    description: Package cache host or base URL
    required: false
    default: ""

  languages:
    description: >
      Comma separated list of languages to force MegaLinter to lint.
      Leave empty to let MegaLinter auto-detect.
      Example: java,python,yaml
    required: false
    default: ""

  exclude-languages:
    description: >
      Comma separated list of languages to tell MegaLinter to skip.
    required: false
    default: ""

  exclude-tools:
    description: >
      Comma separated list of linters to never run.
    required: false
    default: ""

  level:
    description: >
      Minimum reviewdog severity: info, warning, or error.
    required: false
    default: "info"

  filter-mode:
    description: >
      Review scope:
      changed_files, added, diff_context, file, or nofilter.
    required: false
    default: "changed_files"

  fail-level:
    description: >
      Fail threshold: none, any, info, warning, or error.
    required: false
    default: "none"

  reviewdog-version:
    description: >
      Reviewdog version. Use latest or vX.Y.Z.
    required: false
    default: "latest"

  python-version:
    description: >
      Python version used by the Forgejo reporter and AI suggestions.
      Examples: 3, 3.11, 3.12.
    required: false
    default: "3"

  workdir:
    description: Directory to run the review from.
    required: false
    default: "."

  ai-suggestions:
    description: >
      Enable AI-generated descriptions and suggestions for existing
      linter findings.
    required: false
    default: "false"

  ai-base-url:
    description: >
      OpenAI-compatible API base URL.
      Examples:
      http://localhost:8080/v1
      http://ollama:11434/v1
      https://api.openai.com/v1
    required: false
    default: ""

  ai-api-key:
    description: >
      API key for the OpenAI-compatible endpoint.
      Can be empty for local endpoints that do not require authentication.
    required: false
    default: ""

  ai-model:
    description: >
      Model used to generate descriptions and suggestions.
    required: false
    default: ""

  ai-temperature:
    description: >
      Temperature used for AI suggestions.
    required: false
    default: "0"

  ai-max-tokens:
    description: >
      Maximum tokens generated for each AI suggestion.
    required: false
    default: "1024"

  ai-context-lines:
    description: >
      Number of source-code lines included before and after a finding.
    required: false
    default: "10"

runs:
  using: composite

  steps:

    - name: Prepare scripts
      shell: bash
      run: |
        set -euo pipefail

        SCRIPT_DIR="${{ github.action_path }}/scripts"

        chmod +x "$SCRIPT_DIR/"*.sh
        chmod +x "$SCRIPT_DIR/"*.py

    - name: Configure MegaLinter
      id: megalinter-config
      shell: bash
      env:
        LANGUAGES: ${{ inputs.languages }}
        EXCLUDE_LANGUAGES: ${{ inputs.exclude-languages }}
        EXCLUDE_TOOLS: ${{ inputs.exclude-tools }}
      run: |
        set -euo pipefail

        "${{ github.action_path }}/scripts/generate-megalinter-env.sh"

    - name: Run MegaLinter
      id: megalinter
      uses: actions/megalinter@v8
      env:
        # Let our own downstream filter-mode step (changed_files, diff_context,
        # etc.) decide what's in-scope for comments; have MegaLinter itself
        # just lint everything so nothing is missed either way.
        VALIDATE_ALL_CODEBASE: "true"
        DEFAULT_WORKSPACE: ${{ github.workspace }}/${{ inputs.workdir }}
        REPORT_OUTPUT_FOLDER: ${{ github.workspace }}/megalinter-reports

        ENABLE: ${{ env.MEGALINTER_ENABLE }}
        DISABLE: ${{ env.MEGALINTER_DISABLE }}
        DISABLE_LINTERS: ${{ env.MEGALINTER_DISABLE_LINTERS }}

        # We post our own Forgejo comments below; don't let MegaLinter's
        # own reporters (written for GitHub/GitLab) try anything here,
        # and don't let its own exit code fail the job out from under us.
        DISABLE_ERRORS: "true"
        SARIF_REPORTER: "true"
        SARIF_REPORTER_FILE_NAME: "megalinter-report.sarif"
        TEXT_REPORTER: "true"
        GITHUB_COMMENT_REPORTER: "false"
        GITHUB_STATUS_REPORTER: "false"
        UPDATED_SOURCES_REPORTER: "false"
        FILEIO_REPORTER: "false"
        EMAIL_REPORTER: "false"

    - name: Install reviewdog
      id: install-reviewdog
      shell: bash
      env:
        PKG_CACHE: ${{ inputs.pkg_cache }}
        REVIEWDOG_VERSION: ${{ inputs.reviewdog-version }}
      run: |
        set -euo pipefail

        "${{ github.action_path }}/scripts/install-reviewdog.sh"

    - name: Setup Python
      uses: ${{ github.action_repository }}/setup-python@${{ github.action_ref }}
      with:
        python_version: ${{ inputs.python-version }}

    - name: Run reviewdog
      id: review
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        REVIEWDOG_LEVEL: ${{ inputs.level }}
      run: |
        set -euo pipefail

        SARIF_FILE="${{ github.workspace }}/megalinter-reports/megalinter-report.sarif"

        if [ ! -s "$SARIF_FILE" ]; then
          echo "No MegaLinter SARIF findings at $SARIF_FILE."
          echo "(Either nothing was flagged, or none of the matched linters support SARIF output.)"
          : > reviewdog-results.txt
        else
          reviewdog \
            -f=sarif \
            -name=megalinter \
            -reporter=local \
            -level="$REVIEWDOG_LEVEL" \
            -filter-mode=nofilter \
            -fail-level=none \
            < "$SARIF_FILE" \
            > reviewdog-results.txt 2>&1
        fi

    - name: Post Forgejo review
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        FORGEJO_TOKEN: ${{ inputs.token }}
        FORGEJO_API_URL: ${{ env.GITHUB_API_URL }}
        REVIEW_FILTER_MODE: ${{ inputs.filter-mode }}

        AI_SUGGESTIONS: ${{ inputs.ai-suggestions }}
        AI_BASE_URL: ${{ inputs.ai-base-url }}
        AI_API_KEY: ${{ inputs.ai-api-key }}
        AI_MODEL: ${{ inputs.ai-model }}
        AI_TEMPERATURE: ${{ inputs.ai-temperature }}
        AI_MAX_TOKENS: ${{ inputs.ai-max-tokens }}
        AI_CONTEXT_LINES: ${{ inputs.ai-context-lines }}

      run: |
        set -euo pipefail

        "${{ github.action_path }}/scripts/forgejo-review.sh" \
          reviewdog-results.txt