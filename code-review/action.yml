name: 'Multi-language Code Review'

description: >
  Detects programming languages in a repository, runs open-source linters
  through reviewdog, optionally generates AI descriptions and suggestions
  using an OpenAI-compatible endpoint, and posts findings as inline comments
  on Forgejo pull requests.

inputs:
  token:
    description: >
      Token used to post pull-request review comments.
      Defaults to the Forgejo-provided GitHub-compatible workflow token.
    required: false
    default: ${{ github.token }}

  pkg_cache:
    description: Package cache host or base URL
    required: false
    default: ""

  languages:
    description: >
      Comma separated list of languages to force.
      Leave empty to auto-detect.
      Example: java,python,yaml
    required: false
    default: ""

  exclude-languages:
    description: >
      Comma separated list of detected languages to skip.
    required: false
    default: ""

  exclude-tools:
    description: >
      Comma separated list of linters to never run.
    required: false
    default: ""

  min-files:
    description: >
      Minimum number of matching files before a language counts as used.
    required: false
    default: "1"

  level:
    description: >
      Minimum reviewdog severity: info, warning, or error.
    required: false
    default: "info"

  filter-mode:
    description: >
      Review scope:
      changed_files, added, diff_context, file, or nofilter.
    required: false
    default: "changed_files"

  fail-level:
    description: >
      Fail threshold: none, any, info, warning, or error.
    required: false
    default: "none"

  reviewdog-version:
    description: >
      Reviewdog version. Use latest or vX.Y.Z.
    required: false
    default: "latest"

  python-version:
    description: >
      Python version used by the Forgejo reporter and AI suggestions.
      Examples: 3, 3.11, 3.12.
    required: false
    default: "3"

  workdir:
    description: Directory to run the review from.
    required: false
    default: "."

  ai-suggestions:
    description: >
      Enable AI-generated descriptions and suggestions for existing
      linter findings.
    required: false
    default: "false"

  ai-base-url:
    description: >
      OpenAI-compatible API base URL.
      Examples:
      http://localhost:8080/v1
      http://ollama:11434/v1
      https://api.openai.com/v1
    required: false
    default: ""

  ai-api-key:
    description: >
      API key for the OpenAI-compatible endpoint.
      Can be empty for local endpoints that do not require authentication.
    required: false
    default: ""

  ai-model:
    description: >
      Model used to generate descriptions and suggestions.
    required: false
    default: ""

  ai-temperature:
    description: >
      Temperature used for AI suggestions.
    required: false
    default: "0"

  ai-max-tokens:
    description: >
      Maximum tokens generated for each AI suggestion.
    required: false
    default: "1024"

  ai-context-lines:
    description: >
      Number of source-code lines included before and after a finding.
    required: false
    default: "10"

runs:
  using: composite

  steps:

    - name: Prepare scripts
      shell: bash
      run: |
        set -euo pipefail

        SCRIPT_DIR="${{ github.action_path }}/scripts"

        chmod +x "$SCRIPT_DIR/"*.sh
        chmod +x "$SCRIPT_DIR/"*.py

    - name: Detect languages
      id: detect
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        LANGUAGES_OVERRIDE: ${{ inputs.languages }}
        EXCLUDE_LANGUAGES: ${{ inputs.exclude-languages }}
        MIN_FILES: ${{ inputs.min-files }}
      run: |
        set -euo pipefail

        "${{ github.action_path }}/scripts/detect-languages.sh"

    - name: Install reviewdog
      id: install-reviewdog
      shell: bash
      env:
        PKG_CACHE: ${{ inputs.pkg_cache }}
        REVIEWDOG_VERSION: ${{ inputs.reviewdog-version }}
      run: |
        set -euo pipefail

        "${{ github.action_path }}/scripts/install-reviewdog.sh"

    - name: Install detected linters
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        LANGUAGES: ${{ steps.detect.outputs.languages }}
        EXCLUDE_TOOLS: ${{ inputs.exclude-tools }}
        PKG_CACHE: ${{ inputs.pkg_cache }}
      run: |
        set -euo pipefail

        "${{ github.action_path }}/scripts/install-linters.sh"

    - name: Build reviewdog config
      id: config
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        LANGUAGES: ${{ steps.detect.outputs.languages }}
        EXCLUDE_TOOLS: ${{ inputs.exclude-tools }}
      run: |
        set -euo pipefail

        "${{ github.action_path }}/scripts/generate-reviewdog-config.sh"

    - name: Setup Python
      if: steps.config.outputs.runner-count != '0'
      uses: ${{ github.action_repository }}/setup-python@${{ github.action_ref }}
      with:
        python_version: ${{ inputs.python-version }}

    - name: Run reviewdog
      id: review
      if: steps.config.outputs.runner-count != '0'
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        REVIEWDOG_LEVEL: ${{ inputs.level }}
      run: |
        set -euo pipefail

        reviewdog \
          -conf=.reviewdog.generated.yml \
          -reporter=local \
          -level="$REVIEWDOG_LEVEL" \
          -filter-mode=nofilter \
          -fail-level=none \
          > reviewdog-results.txt 2>&1

    - name: Post Forgejo review
      if: steps.config.outputs.runner-count != '0'
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        FORGEJO_TOKEN: ${{ inputs.token }}
        FORGEJO_API_URL: ${{ env.GITHUB_API_URL }}
        REVIEW_FILTER_MODE: ${{ inputs.filter-mode }}

        AI_SUGGESTIONS: ${{ inputs.ai-suggestions }}
        AI_BASE_URL: ${{ inputs.ai-base-url }}
        AI_API_KEY: ${{ inputs.ai-api-key }}
        AI_MODEL: ${{ inputs.ai-model }}
        AI_TEMPERATURE: ${{ inputs.ai-temperature }}
        AI_MAX_TOKENS: ${{ inputs.ai-max-tokens }}
        AI_CONTEXT_LINES: ${{ inputs.ai-context-lines }}

      run: |
        set -euo pipefail

        "${{ github.action_path }}/scripts/forgejo-review.sh" \
          reviewdog-results.txt

    - name: No linters ran
      if: steps.config.outputs.runner-count == '0'
      shell: bash
      run: |
        echo "No supported/detected languages had a matching linter installed."
        echo "Nothing to review."