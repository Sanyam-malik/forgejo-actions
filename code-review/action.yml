name: 'Multi-language Code Review'

description: >
  Detects programming languages in a repository, runs open-source linters
  through reviewdog, writes normalized review items as JSON, and delegates
  shared filtering, comment lifecycle, and posting to code-analyzer.

inputs:
  token:
    description: >
      Token used to post pull-request review comments.
      Defaults to the Forgejo-provided GitHub-compatible workflow token.
    required: false
    default: ${{ github.token }}

  languages:
    description: >
      Comma separated list of languages to force MegaLinter to lint.
      Leave empty to let MegaLinter auto-detect.
      Example: java,python,yaml
    required: false
    default: ""

  exclude-languages:
    description: >
      Comma separated list of languages to tell MegaLinter to skip.
    required: false
    default: ""

  exclude-tools:
    description: >
      Comma separated list of linters to never run.
    required: false
    default: ""

  level:
    description: >
      Minimum severity posted as PR comments: info, warning, or error.
      Findings below this severity are parsed but dropped before
      posting comments. (This is enforced by code-analyzer, not by
      reviewdog's own -level flag, which does not filter output for the
      rdjson reporter used here.)
    required: false
    default: "error"

  filter-mode:
    description: >
      Review scope:
      changed_files, added, diff_context, file, or nofilter.
    required: false
    default: "changed_files"

  fail-level:
    description: >
      Fail threshold: none, any, info, warning, or error. Evaluated
      against the findings that were actually turned into comments.
    required: false
    default: "none"

  skip-existing:
    description: >
      Only post findings that were not already commented on by an earlier
      run, and auto-mark earlier comments whose finding is no longer
      present. Each comment carries a hidden fingerprint of the finding
      (file, tool, rule, message and the flagged line's text), so pushing
      new commits adds only new or changed findings, and edits that merely
      shift line numbers do not repost old ones.

      When a fingerprint that had a comment no longer appears in the
      current findings, that comment is edited to say "Fixed by <commit
      sha>" -- Forgejo's REST API has no way to mark a review conversation
      resolved, so this comment edit is the closest equivalent. If the
      same issue reappears later, it gets a brand new comment.

      fail-level is still evaluated against all current findings,
      regardless of this setting.
    required: false
    default: "true"

  reviewdog-version:
    description: >
      Reviewdog version. Use latest or vX.Y.Z.
    required: false
    default: "latest"

  workdir:
    description: Directory to run the review from.
    required: false
    default: "."

outputs:
  item-count:
    description: Number of new/changed findings posted as comments.
    value: ${{ steps.analyzer.outputs.item-count }}

  total-count:
    description: Total findings in this run, including ones already commented on earlier.
    value: ${{ steps.analyzer.outputs.total-count }}

  skipped-existing-count:
    description: Findings not reposted because an earlier run already commented on them.
    value: ${{ steps.analyzer.outputs.skipped-existing-count }}

  resolved-count:
    description: Earlier comments edited to say "Fixed by <sha>" because their finding is gone.
    value: ${{ steps.analyzer.outputs.resolved-count }}

  should-fail:
    description: '"true" if fail-level was met by the current findings.'
    value: ${{ steps.analyzer.outputs.should-fail }}

runs:
  using: composite

  steps:

    - name: Prepare scripts
      shell: bash
      run: |
        set -euo pipefail

        SCRIPT_DIR="${{ github.action_path }}/scripts"

        chmod +x "$SCRIPT_DIR/"*.sh
        chmod +x "$SCRIPT_DIR/"*.py

    - name: Configure MegaLinter
      id: megalinter-config
      shell: bash
      env:
        LANGUAGES: ${{ inputs.languages }}
        EXCLUDE_LANGUAGES: ${{ inputs.exclude-languages }}
        EXCLUDE_TOOLS: ${{ inputs.exclude-tools }}
        REVIEW_WORKDIR: ${{ inputs.workdir }}
      run: |
        set -euo pipefail

        "${{ github.action_path }}/scripts/generate-megalinter-env.sh"

    - name: Run MegaLinter
      id: megalinter
      uses: actions/megalinter@v8
      env:
        VALIDATE_ALL_CODEBASE: "true"
        DEFAULT_WORKSPACE: ${{ github.workspace }}/${{ inputs.workdir }}
        REPORT_OUTPUT_FOLDER: ${{ github.workspace }}/megalinter-reports

        ENABLE: ${{ env.MEGALINTER_ENABLE }}
        DISABLE: ${{ env.MEGALINTER_DISABLE }}
        DISABLE_LINTERS: ${{ env.MEGALINTER_DISABLE_LINTERS }}

        DISABLE_ERRORS: "true"
        SARIF_REPORTER: "true"
        SARIF_REPORTER_FILE_NAME: "megalinter-report.sarif"
        TEXT_REPORTER: "true"
        GITHUB_COMMENT_REPORTER: "false"
        GITHUB_STATUS_REPORTER: "false"
        UPDATED_SOURCES_REPORTER: "false"
        FILEIO_REPORTER: "false"
        EMAIL_REPORTER: "false"

    - name: Install reviewdog
      id: install-reviewdog
      shell: bash
      env:
        REVIEWDOG_VERSION: ${{ inputs.reviewdog-version }}
        PKG_CACHE: ${{ env.PKG_CACHE }}
      run: |
        set -euo pipefail

        "${{ github.action_path }}/scripts/install-reviewdog.sh"

    - name: Setup Python
      uses: ${{ github.action_repository }}/setup-python@${{ github.action_ref }}
      with:
        python_version: "3"

    - name: Run reviewdog
      id: review
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: |
        set -euo pipefail

        SARIF_FILE="${{ github.workspace }}/megalinter-reports/megalinter-report.sarif"

        if [ ! -s "$SARIF_FILE" ]; then
          echo "No MegaLinter SARIF findings at $SARIF_FILE."
          echo "(Either nothing was flagged, or none of the matched linters support SARIF output.)"
          printf '%s\n' '{"diagnostics":[]}' > reviewdog-results.txt
        else
          reviewdog \
            -f=sarif \
            -name=megalinter \
            -reporter=rdjson \
            -filter-mode=nofilter \
            -fail-level=none \
            < "$SARIF_FILE" \
            > reviewdog-results.txt
        fi

    - name: Build review items
      id: build
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        RESULT_FILE: reviewdog-results.txt
        FILTER_MODE: ${{ inputs.filter-mode }}
        ITEMS_OUTPUT: ${{ github.workspace }}/review-items.json
        API_URL: ${{ github.api_url }}
        OWNER: ${{ github.repository_owner }}
        REPO: ${{ github.event.repository.name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        python3 "${{ github.action_path }}/scripts/build-review-items.py"

    - name: Analyze code review
      id: analyzer
      uses: ${{ github.action_repository }}/code-analyzer@${{ github.action_ref }}
      with:
        items-file: ${{ github.workspace }}/review-items.json
        message-template-file: ${{ github.action_path }}/templates/review-comment.md
        level: ${{ inputs.level }}
        skip-existing: ${{ inputs.skip-existing }}
        fingerprint-mode: lint
        fingerprint-prefix: lint-review
        fail-level: ${{ inputs.fail-level }}
        review-body: |
          **🤖Automated code review by MegaLinter and reviewdog.**
          Posting {count} comment(s)
        path-field: path
        line-field: line
        token: ${{ inputs.token }}
