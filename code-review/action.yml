name: 'Multi-language Code Review'
description: >
  Detects programming languages in a repository, runs open-source linters
  through reviewdog, and posts findings as inline comments on Forgejo
  pull requests. Security and secret scanning are intentionally out of scope.

inputs:
  token:
    description: >
      Token used to post pull-request review comments.
      Defaults to the Forgejo-provided GitHub-compatible workflow token.
    required: false
    default: ${{ github.token }}

  pkg_cache:
    description: Package cache host or base URL
    required: false
    default: ""

  languages:
    description: >
      Comma separated list of languages to force.
      Leave empty to auto-detect.
      Example: java,python,yaml
    required: false
    default: ""

  exclude-languages:
    description: >
      Comma separated list of detected languages to skip.
    required: false
    default: ""

  exclude-tools:
    description: >
      Comma separated list of linters to never run.
    required: false
    default: ""

  min-files:
    description: >
      Minimum number of matching files before a language counts as used.
    required: false
    default: "1"

  level:
    description: >
      Minimum reviewdog severity: info, warning, or error.
    required: false
    default: "info"

  filter-mode:
    description: >
      Forgejo review filtering mode:
      added, diff_context, file, or nofilter.
    required: false
    default: "added"

  fail-level:
    description: >
      Fail threshold: none, any, info, warning, or error.
    required: false
    default: "none"

  reviewdog-version:
    description: >
      Reviewdog version. Use latest, nightly, or vX.Y.Z.
    required: false
    default: "latest"

  python-version:
    description: >
      Python version used by the Forgejo reporter.
      Examples: 3, 3.11, 3.12.
    required: false
    default: "3"

  workdir:
    description: Directory to run the review from.
    required: false
    default: "."

runs:
  using: composite

  steps:

    # ============================================================
    # Prepare scripts
    # ============================================================

    - name: Prepare scripts
      shell: bash
      run: |
        set -euo pipefail

        SCRIPT_DIR="${{ github.action_path }}/scripts"

        chmod +x "$SCRIPT_DIR/"*.sh

        echo "Action scripts:"
        ls -la "$SCRIPT_DIR"

    # ============================================================
    # Detect languages
    # ============================================================

    - name: Detect languages
      id: detect
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        LANGUAGES_OVERRIDE: ${{ inputs.languages }}
        EXCLUDE_LANGUAGES: ${{ inputs.exclude-languages }}
        MIN_FILES: ${{ inputs.min-files }}
      run: |
        set -euo pipefail

        "${{ github.action_path }}/scripts/detect-languages.sh"

    # ============================================================
    # Install reviewdog
    # ============================================================

    - name: Install reviewdog
      id: install-reviewdog
      shell: bash
      env:
        PKG_CACHE: ${{ inputs.pkg_cache }}
        REVIEWDOG_VERSION: ${{ inputs.reviewdog-version }}
      run: |
        set -euo pipefail

        "${{ github.action_path }}/scripts/install-reviewdog.sh"

    # ============================================================
    # Install linters
    # ============================================================

    - name: Install detected linters
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        LANGUAGES: ${{ steps.detect.outputs.languages }}
        EXCLUDE_TOOLS: ${{ inputs.exclude-tools }}
        PKG_CACHE: ${{ inputs.pkg_cache }}
      run: |
        set -euo pipefail

        "${{ github.action_path }}/scripts/install-linters.sh"

    # ============================================================
    # Generate reviewdog configuration
    # ============================================================

    - name: Build reviewdog config
      id: config
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        LANGUAGES: ${{ steps.detect.outputs.languages }}
        EXCLUDE_TOOLS: ${{ inputs.exclude-tools }}
      run: |
        set -euo pipefail

        "${{ github.action_path }}/scripts/generate-reviewdog-config.sh"

    # ============================================================
    # Setup Python for custom Forgejo reporter
    # ============================================================

    - name: Setup Python
      if: steps.config.outputs.runner-count != '0'
      uses: ${{ github.action_repository }}/setup-python@${{ github.action_ref }}
      with:
        python_version: ${{ inputs.python-version }}

    # ============================================================
    # Run reviewdog
    #
    # IMPORTANT:
    # Do NOT use -filter-mode=added here.
    #
    # reviewdog's PR filtering normally relies on a reporter providing
    # the PR diff. We deliberately use our own Forgejo reporter, so
    # the Forgejo reporter owns diff filtering.
    # ============================================================

    - name: Run reviewdog
      id: review
      if: steps.config.outputs.runner-count != '0'
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        REVIEWDOG_LEVEL: ${{ inputs.level }}
      run: |
        set -euo pipefail

        echo "Running reviewdog"
        echo "Level: $REVIEWDOG_LEVEL"
        echo "Filter mode will be handled by custom Forgejo reporter"

        reviewdog \
          -conf=.reviewdog.generated.yml \
          -reporter=local \
          -level="$REVIEWDOG_LEVEL" \
          -filter-mode=nofilter \
          -fail-level=none \
          -tee \
          > reviewdog-results.txt

        echo
        echo "========================================"
        echo "Reviewdog output"
        echo "========================================"

        cat reviewdog-results.txt || true

    # ============================================================
    # Custom Forgejo reporter
    # ============================================================

    - name: Post Forgejo review
      if: steps.config.outputs.runner-count != '0'
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        FORGEJO_TOKEN: ${{ inputs.token }}
        FORGEJO_API_URL: ${{ env.GITHUB_API_URL }}
        REVIEW_FILTER_MODE: ${{ inputs.filter-mode }}
      run: |
        set -euo pipefail

        "${{ github.action_path }}/scripts/forgejo-review.sh" \
          reviewdog-results.txt

    # ============================================================
    # Nothing to review
    # ============================================================

    - name: No linters ran
      if: steps.config.outputs.runner-count == '0'
      shell: bash
      run: |
        echo "No supported/detected languages had a matching linter installed."
        echo "Nothing to review."