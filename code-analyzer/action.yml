name: 'Code Analyzer'
description: >
  Apply shared review-item filtering, fingerprint deduplication, existing
  comment resolution, posting, and fail-level enforcement.

inputs:
  items-file:
    description: Path to the JSON array or review envelope generated by a producer.
    required: true

  message-template-file:
    description: Path to the template used to render each review item.
    required: true

  review-body:
    description: Top-level review summary comment. Empty uses producer metadata.
    required: false
    default: ""

  path-field:
    description: Dotted path to the file path in each item.
    required: false
    default: "path"

  line-field:
    description: Dotted path to the line number in each item.
    required: false
    default: "line"

  level:
    description: "Minimum severity to post: none, info, warning, or error."
    required: false
    default: "none"

  skip-existing:
    description: Skip open fingerprints already commented on and auto-mark stale comments fixed.
    required: false
    default: "true"

  max-comments:
    description: Maximum comments to post after deduplication. Zero means no limit.
    required: false
    default: "0"

  fingerprint-mode:
    description: "Fingerprint fields to use: generic, lint, or ai."
    required: false
    default: "generic"

  fingerprint-prefix:
    description: Hidden comment marker prefix used by this producer.
    required: false
    default: "review"

  dedupe:
    description: Drop duplicate rendered comments before posting.
    required: false
    default: "true"

  fail-level:
    description: "Fail threshold: none, any, info, warning, or error."
    required: false
    default: "none"

  token:
    description: Token used to read and post pull-request review comments.
    required: false
    default: ${{ github.token }}

outputs:
  comments-posted:
    description: Number of inline comments posted.
    value: ${{ steps.post.outputs.comments-posted }}

  item-count:
    description: Number of review items posted after filtering and deduplication.
    value: ${{ steps.analyze.outputs.item-count }}

  total-count:
    description: Number of current findings before existing-comment suppression.
    value: ${{ steps.analyze.outputs.total-count }}

  skipped-existing-count:
    description: Findings not reposted because an earlier comment is still open.
    value: ${{ steps.analyze.outputs.skipped-existing-count }}

  resolved-count:
    description: Earlier comments auto-marked fixed because their finding disappeared.
    value: ${{ steps.analyze.outputs.resolved-count }}

  should-fail:
    description: Whether the fail threshold was met by current findings.
    value: ${{ steps.analyze.outputs.should-fail }}

  summary:
    description: Producer-generated or shared review summary.
    value: ${{ steps.analyze.outputs.summary }}

runs:
  using: composite
  steps:
    - name: Analyze review items
      id: analyze
      shell: bash
      env:
        ITEMS_FILE: ${{ inputs.items-file }}
        REVIEW_BODY: ${{ inputs.review-body }}
        LEVEL: ${{ inputs.level }}
        SKIP_EXISTING: ${{ inputs.skip-existing }}
        MAX_COMMENTS: ${{ inputs.max-comments }}
        FINGERPRINT_MODE: ${{ inputs.fingerprint-mode }}
        FINGERPRINT_PREFIX: ${{ inputs.fingerprint-prefix }}
        FAIL_LEVEL: ${{ inputs.fail-level }}
        API_URL: ${{ github.api_url }}
        OWNER: ${{ github.repository_owner }}
        REPO: ${{ github.event.repository.name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        python3 "${{ github.action_path }}/scripts/analyze-review.py"

    - name: Post PR comments
      id: post
      if: ${{ steps.analyze.outputs.item-count != '0' && steps.analyze.outputs.item-count != '' }}
      uses: ${{ github.action_repository }}/post-file-comment@${{ github.action_ref }}
      with:
        items-file: ${{ inputs.items-file }}
        message-template-file: ${{ inputs.message-template-file }}
        path-field: ${{ inputs.path-field }}
        line-field: ${{ inputs.line-field }}
        dedupe: ${{ inputs.dedupe }}
        review-body: ${{ steps.analyze.outputs.review-body }}
        token: ${{ inputs.token }}
        fail-on-comments: "false"

    - name: Enforce fail level
      if: ${{ steps.analyze.outputs.should-fail == 'true' }}
      shell: bash
      env:
        FAIL_LEVEL: ${{ inputs.fail-level }}
      run: |
        set -euo pipefail
        echo "Fail level '${FAIL_LEVEL}' was met by the code review findings."
        exit 1
