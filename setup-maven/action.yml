name: Setup Maven
description: Install Maven using the inherited PKG_CACHE mirror when set

inputs:
  maven_version:
    description: Maven version (use 'latest' for current stable release)
    required: false
    default: latest

outputs:
  maven_version:
    description: Installed Maven version
    value: ${{ steps.install.outputs.maven_version }}

runs:
  using: composite
  steps:
    - id: install
      name: Install Maven
      shell: bash
      env:
        MAVEN_VERSION: ${{ inputs.maven_version }}
        PKG_CACHE: ${{ env.PKG_CACHE }}
      run: |
        set -euo pipefail

        PKG_CACHE="${PKG_CACHE:-}"
        VERSION="${MAVEN_VERSION}"

        if [ -n "$PKG_CACHE" ]; then
          PKG_CACHE_BASE="$PKG_CACHE"
          case "$PKG_CACHE_BASE" in
            http://*|https://*) ;;
            *) PKG_CACHE_BASE="https://$PKG_CACHE_BASE" ;;
          esac
          PKG_CACHE_BASE="${PKG_CACHE_BASE%/}"
          MAVEN_REPO_BASE="${PKG_CACHE_BASE}/repo.maven.apache.org"
          MAVEN_DOWNLOAD_BASE="${PKG_CACHE_BASE}/dlcdn.apache.org"
          MAVEN_ARCHIVE_BASE="${PKG_CACHE_BASE}/archive.apache.org"
          echo "Using pkg-cache mirror for Maven sources"
        else
          MAVEN_REPO_BASE="https://repo.maven.apache.org"
          MAVEN_DOWNLOAD_BASE="https://dlcdn.apache.org"
          MAVEN_ARCHIVE_BASE="https://archive.apache.org"
          echo "Using public Apache sources"
        fi

        # --------------------------------------------------
        # Resolve latest version (strict X.Y.Z)
        # --------------------------------------------------
        if [ "$VERSION" = "latest" ]; then
          METADATA_URL="${MAVEN_REPO_BASE}/maven2/org/apache/maven/apache-maven/maven-metadata.xml"

          echo "Resolving latest stable Maven version..."

          VERSION=$(curl -fsSL --retry 5 --retry-delay 5 "$METADATA_URL" \
            | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n1)
        fi

        echo "Resolved version: $VERSION"

        # --------------------------------------------------
        # Build paths
        # --------------------------------------------------
        MAJOR_VERSION=$(echo "$VERSION" | cut -d. -f1)
        BASE_PATH="maven-${MAJOR_VERSION}"
        FILE="apache-maven-${VERSION}-bin.tar.gz"

        URLS=(
          "${MAVEN_DOWNLOAD_BASE}/maven/${BASE_PATH}/${VERSION}/binaries/${FILE}"
          "${MAVEN_ARCHIVE_BASE}/dist/maven/${BASE_PATH}/${VERSION}/binaries/${FILE}"
        )

        # --------------------------------------------------
        # Download with fallback
        # --------------------------------------------------
        SUCCESS=0

        for URL in "${URLS[@]}"; do
          echo "Trying: $URL"

          if curl -fL --retry 3 --retry-delay 5 -o maven.tar.gz "$URL"; then
            if tar -tzf maven.tar.gz >/dev/null 2>&1; then
              echo "Download + validation succeeded from: $URL"
              SUCCESS=1
              break
            else
              echo "Invalid archive (likely HTML/corrupt), trying next..."
            fi
          else
            echo "Download failed, trying next..."
          fi
        done

        if [ "$SUCCESS" -ne 1 ]; then
          echo "❌ Failed to download Maven $VERSION from all sources"
          exit 1
        fi

        # --------------------------------------------------
        # Extract & setup
        # --------------------------------------------------
        tar -xzf maven.tar.gz
        mv "apache-maven-${VERSION}" "$HOME/.maven-dist"

        # Outputs
        echo "maven_version=$VERSION" >> "$GITHUB_OUTPUT"

        # Persist for next steps
        echo "MAVEN_HOME=$HOME/.maven-dist" >> "$GITHUB_ENV"
        echo "$HOME/.maven-dist/bin" >> "$GITHUB_PATH"

        # 🔥 CRITICAL: also set for CURRENT step
        export MAVEN_HOME="$HOME/.maven-dist"
        export PATH="$MAVEN_HOME/bin:$PATH"

        echo "Maven installed at: $MAVEN_HOME/bin/mvn"
        echo "Detected mvn path: $(command -v mvn)"

        # Sanity check
        if [ ! -x "$MAVEN_HOME/bin/mvn" ]; then
          echo "❌ Maven binary not found!"
          exit 1
        fi

        mvn -version
