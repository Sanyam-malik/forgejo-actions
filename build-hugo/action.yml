name: Build Hugo Site
description: Build Hugo static website

inputs:
  working_dir:
    description: Directory containing Hugo site
    required: false
    default: "."

  base_url:
    description: Hugo base URL
    required: false
    default: "/"

  output_dir:
    description: Custom output directory (optional)
    required: false
    default: ""

outputs:
  output_dir:
    description: Hugo build output directory
    value: ${{ steps.build.outputs.output_dir }}

runs:
  using: composite
  steps:
    - name: Build site
      id: build
      shell: bash
      env:
        PKG_CACHE: ${{ env.PKG_CACHE }}
        WORKING_DIR: ${{ inputs.working_dir }}
        BASE_URL_INPUT: ${{ inputs.base_url }}
        OUTPUT_DIR_INPUT: ${{ inputs.output_dir }}
      run: |
        set -euo pipefail

        # ----------------------------------------
        # Setup Go module proxy (CRITICAL)
        # ----------------------------------------
        PKG_CACHE="${PKG_CACHE:-}"
        if [ -n "$PKG_CACHE" ]; then
          PKG_CACHE_BASE="$PKG_CACHE"
          case "$PKG_CACHE_BASE" in
            http://*|https://*) ;;
            *) PKG_CACHE_BASE="https://$PKG_CACHE_BASE" ;;
          esac
          PKG_CACHE_BASE="${PKG_CACHE_BASE%/}"

          echo "Using pkg-cache for Go modules"

          export GOPROXY="${PKG_CACHE_BASE}/proxy.golang.org,direct"
          export GOSUMDB="sum.golang.org"

          # Optional: avoid direct GitHub bypass for some modules
          export GONOSUMDB=""
          export GOPRIVATE=""

          echo "GOPROXY=$GOPROXY"
        else
          echo "No pkg-cache provided, using default Go proxy"
        fi

        cd "${WORKING_DIR}"

        # ----------------------------------------
        # Run Hugo build
        # ----------------------------------------
        if [ -n "${OUTPUT_DIR_INPUT}" ]; then
          echo "Using custom output directory: ${OUTPUT_DIR_INPUT}"

          hugo \
            --minify \
            --gc \
            --baseURL "${BASE_URL_INPUT}" \
            --destination "${OUTPUT_DIR_INPUT}"

          OUTPUT_DIR="${OUTPUT_DIR_INPUT}"

        else
          echo "No output_dir provided. Running Hugo with default output."

          hugo \
            --minify \
            --gc \
            --baseURL "${BASE_URL_INPUT}"

          # ----------------------------------------
          # Validate Hugo output
          # ----------------------------------------
          if [ ! -d "public" ]; then
            echo "❌ Hugo build did not produce the 'public' directory."
            exit 1
          fi

          # Case 1: Root index
          if [ -f "public/index.html" ]; then
            echo "Detected root index.html"
            OUTPUT_DIR="public"

          else
            echo "Root index.html not found. Searching subdirectories..."

            INDEX_FILE=$(
              find public -type f -name "index.html" \
                ! -path "public/index.html" \
                | sort \
                | head -n 1
            )

            if [ -z "$INDEX_FILE" ]; then
              echo "❌ No index.html found anywhere inside 'public'."
              echo "Debugging directory structure:"
              find public -maxdepth 3 -print
              exit 1
            fi

            OUTPUT_DIR=$(dirname "$INDEX_FILE")
          fi
        fi

        echo "Found build output directory: $OUTPUT_DIR"
        echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"
