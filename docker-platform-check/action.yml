name: Docker Build
description: Build Docker image

inputs:
  build_args:
    description: Additional docker build arguments
    required: false
    default: ""

  platforms:
    description: Comma-separated list of target platforms
    required: false
    default: linux/amd64,linux/arm64,linux/arm/v7

  on_unsupported_platform:
    description: What to do when a platform cannot be built. Allowed values are skip or error.
    required: false
    default: skip

outputs:
  supported_platforms:
    description: Comma-separated list of platforms that can be built
    value: ${{ steps.build.outputs.supported_platforms }}

  builder_name:
    description: Name of the Buildx builder created for this run. Pass to the push action to reuse it.
    value: ${{ steps.build.outputs.builder_name }}

runs:
  using: composite

  steps:
    - id: build
      shell: bash
      run: |
        set -euo pipefail

        # ------------------------------------------------------------
        # Install dependencies
        # ------------------------------------------------------------
        echo "Installing dependencies..."

        if ! command -v jq >/dev/null 2>&1; then
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache jq

          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq jq

          elif command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm jq

          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y jq

          elif command -v yum >/dev/null 2>&1; then
            yum install -y jq

          else
            echo "::error::Unable to install dependencies. No supported package manager found."
            exit 1
          fi
        fi

        # ------------------------------------------------------------
        # Configuration
        # ------------------------------------------------------------
        REQUESTED_PLATFORMS="${{ inputs.platforms }}"
        ON_UNSUPPORTED_PLATFORM="${{ inputs.on_unsupported_platform }}"

        # ------------------------------------------------------------
        # Validate inputs
        # ------------------------------------------------------------
        if [[ "${ON_UNSUPPORTED_PLATFORM}" != "skip" &&
              "${ON_UNSUPPORTED_PLATFORM}" != "error" ]]; then
          echo "::error::Invalid on_unsupported_platform '${ON_UNSUPPORTED_PLATFORM}'. Expected 'skip' or 'error'."
          exit 1
        fi

        # ------------------------------------------------------------
        # Generate a unique builder name.
        #
        # Using a fixed name (e.g. "docker-build") breaks when multiple
        # workflow runs build concurrently on the same runner, since
        # they'd all fight over one builder. A random suffix per run
        # avoids that.
        # ------------------------------------------------------------
        if command -v uuidgen >/dev/null 2>&1; then
          UUID="$(uuidgen)"
        elif [[ -r /proc/sys/kernel/random/uuid ]]; then
          UUID="$(cat /proc/sys/kernel/random/uuid)"
        else
          UUID="$(date +%s%N)-${RANDOM}"
        fi

        BUILDER_NAME="build_${UUID}"

        echo "Builder name: ${BUILDER_NAME}"

        # ------------------------------------------------------------
        # Create Buildx builder
        # ------------------------------------------------------------
        docker buildx create \
          --name "${BUILDER_NAME}" \
          --use \
          --driver docker-container \
          >/dev/null 2>&1

        # ------------------------------------------------------------
        # Cleanup Buildx builder on error only.
        #
        # On success the builder is left in place so a downstream
        # push action can reuse it (and its build cache) instead of
        # rebuilding every layer from scratch.
        #
        # trap ... ERR catches unexpected command failures (anything
        # that trips `set -e`). It does NOT fire on an explicit `exit`,
        # so intentional error exits below call cleanup themselves
        # before exiting.
        # ------------------------------------------------------------
        cleanup() {
          echo ""
          echo "============================================================"
          echo "Cleaning up Buildx builder (error)"
          echo "============================================================"

          docker buildx rm --force "${BUILDER_NAME}" >/dev/null 2>&1 || true

          echo "Buildx cleanup completed."
        }

        trap cleanup ERR

        # ------------------------------------------------------------
        # Parse requested platforms
        # ------------------------------------------------------------
        IFS=',' read -ra platforms <<< "${REQUESTED_PLATFORMS}"

        supported_platforms=""

        echo ""
        echo "Requested platforms: ${REQUESTED_PLATFORMS}"
        echo "On unsupported platform: ${ON_UNSUPPORTED_PLATFORM}"
        echo ""

        # ------------------------------------------------------------
        # Validate each platform by actually solving the Dockerfile.
        #
        # IMPORTANT:
        #   type=cacheonly means NOTHING is pushed.
        #
        # This catches failures such as:
        #   - unavailable packages
        #   - unsupported binaries
        #   - failed RUN commands
        #   - architecture-specific compilation errors
        #   - unsupported base images
        # ------------------------------------------------------------
        for platform in "${platforms[@]}"; do
          platform="$(echo "${platform}" | xargs)"

          [[ -z "${platform}" ]] && continue

          echo "============================================================"
          echo "Checking platform: ${platform}"
          echo "============================================================"

          if docker buildx build \
              --builder "${BUILDER_NAME}" \
              --platform "${platform}" \
              ${{ inputs.build_args }} \
              --output type=cacheonly \
              .; then

            echo "✓ ${platform} image can be built"

            if [[ -z "${supported_platforms}" ]]; then
              supported_platforms="${platform}"
            else
              supported_platforms="${supported_platforms},${platform}"
            fi

          else
            if [[ "${ON_UNSUPPORTED_PLATFORM}" == "skip" ]]; then
              echo "::warning::${platform} image cannot be built, skipping platform"
            else
              echo "::error::${platform} image cannot be built"
              cleanup
              exit 1
            fi
          fi

          echo ""
        done

        # ------------------------------------------------------------
        # Make sure at least one platform succeeded
        # ------------------------------------------------------------
        if [[ -z "${supported_platforms}" ]]; then
          echo "::error::None of the requested platforms can be built."
          cleanup
          exit 1
        fi

        echo "============================================================"
        echo "Supported platforms: ${supported_platforms}"
        echo "Builder: ${BUILDER_NAME}"
        echo "============================================================"
        echo ""
        echo "supported_platforms=${supported_platforms}" >> "${GITHUB_OUTPUT}"
        echo "builder_name=${BUILDER_NAME}" >> "${GITHUB_OUTPUT}"