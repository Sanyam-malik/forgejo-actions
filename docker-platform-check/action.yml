name: Docker Platform Check
description: Validate Docker image platforms

inputs:
  build_args:
    description: Additional docker build arguments
    required: false
    default: ""

  platforms:
    description: Comma-separated list of target platforms
    required: false
    default: linux/amd64,linux/arm64,linux/arm/v7

outputs:
  supported_platforms:
    description: Comma-separated list of platforms that can be built
    value: ${{ steps.build.outputs.supported_platforms }}

runs:
  using: composite

  steps:
    - id: build
      name: Validate Docker platforms
      shell: bash
      env:
        REQUESTED_PLATFORMS: ${{ inputs.platforms }}
        BUILD_ARGS: ${{ inputs.build_args }}
      run: |
        set -euo pipefail

        # ------------------------------------------------------------
        # Validate configuration
        # ------------------------------------------------------------
        if [[ -z "${REQUESTED_PLATFORMS}" ]]; then
          echo "::error::platforms input is empty. Nothing to build."
          exit 1
        fi

        # ------------------------------------------------------------
        # Generate a unique builder name.
        # ------------------------------------------------------------
        if command -v uuidgen >/dev/null 2>&1; then
          UUID="$(uuidgen)"
        elif [[ -r /proc/sys/kernel/random/uuid ]]; then
          UUID="$(cat /proc/sys/kernel/random/uuid)"
        else
          UUID="$(date +%s%N)-${RANDOM}"
        fi

        BUILDER_NAME="build_${UUID}"

        echo "============================================================"
        echo "Docker Buildx"
        echo "============================================================"
        echo "Builder   : ${BUILDER_NAME}"
        echo "Platforms : ${REQUESTED_PLATFORMS}"
        echo "============================================================"
        echo ""

        # ------------------------------------------------------------
        # Create Buildx builder
        # ------------------------------------------------------------
        docker buildx create \
          --name "${BUILDER_NAME}" \
          --use \
          --driver docker-container \
          >/dev/null

        # ------------------------------------------------------------
        # Cleanup builder on unexpected failure.
        #
        # On success the builder is also removed because this action
        # does not expose the builder for downstream reuse.
        # ------------------------------------------------------------
        cleanup() {
          local exit_code=$?

          echo ""
          echo "============================================================"
          echo "Cleaning up Buildx builder"
          echo "============================================================"

          docker buildx rm \
            --force \
            "${BUILDER_NAME}" \
            >/dev/null 2>&1 || true

          echo "Buildx cleanup completed."

          exit "${exit_code}"
        }

        trap cleanup EXIT

        # ------------------------------------------------------------
        # Parse requested platforms
        # ------------------------------------------------------------
        IFS=',' read -ra PLATFORMS <<< "${REQUESTED_PLATFORMS}"

        SUPPORTED_PLATFORMS=""

        echo "Requested platforms: ${REQUESTED_PLATFORMS}"
        echo ""

        # ------------------------------------------------------------
        # Validate each platform by actually solving the Dockerfile.
        #
        # Build arguments are passed to the Dockerfile so validation
        # reflects the real build requirements.
        #
        # type=cacheonly means nothing is exported or pushed.
        # ------------------------------------------------------------
        for platform in "${PLATFORMS[@]}"; do
          platform="$(echo "${platform}" | xargs)"

          [[ -z "${platform}" ]] && continue

          echo "============================================================"
          echo "Checking platform: ${platform}"
          echo "============================================================"

          BUILD_COMMAND=(
            docker buildx build
            --builder "${BUILDER_NAME}"
            --platform "${platform}"
            --output type=cacheonly
          )

          if [[ -n "${BUILD_ARGS}" ]]; then
            # shellcheck disable=SC2206
            EXTRA_BUILD_ARGS=( ${BUILD_ARGS} )
            BUILD_COMMAND+=( "${EXTRA_BUILD_ARGS[@]}" )
          fi

          BUILD_COMMAND+=( "." )

          if "${BUILD_COMMAND[@]}"; then
            echo "✓ ${platform} image can be built"

            if [[ -z "${SUPPORTED_PLATFORMS}" ]]; then
              SUPPORTED_PLATFORMS="${platform}"
            else
              SUPPORTED_PLATFORMS="${SUPPORTED_PLATFORMS},${platform}"
            fi
          else
            echo "::warning::${platform} image cannot be built, skipping platform"
          fi

          echo ""
        done

        # ------------------------------------------------------------
        # Make sure at least one platform succeeded
        # ------------------------------------------------------------
        if [[ -z "${SUPPORTED_PLATFORMS}" ]]; then
          echo "::error::None of the requested platforms can be built."
          exit 1
        fi

        # ------------------------------------------------------------
        # Results
        # ------------------------------------------------------------
        echo "============================================================"
        echo "Docker platform validation complete"
        echo "============================================================"
        echo "Requested platforms : ${REQUESTED_PLATFORMS}"
        echo "Supported platforms : ${SUPPORTED_PLATFORMS}"
        echo "============================================================"
        echo ""

        # ------------------------------------------------------------
        # Output
        # ------------------------------------------------------------
        echo "supported_platforms=${SUPPORTED_PLATFORMS}" >> "${GITHUB_OUTPUT}"
