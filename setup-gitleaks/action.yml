name: Install Gitleaks
description: Install the Gitleaks CLI on the runner

inputs:
  version:
    description: Gitleaks version to install (e.g. "8.18.0"). Defaults to the latest release.
    required: false
    default: latest

  install_dir:
    description: Directory to install the gitleaks binary into. Must be on PATH, or added to PATH by this action.
    required: false
    default: /usr/local/bin

  pkg_cache:
    description: Package cache host or base URL to mirror GitHub releases through (e.g. an internal proxy). Falls back to github.com when empty.
    required: false
    default: ""

outputs:
  version:
    description: The Gitleaks version that was installed
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite

  steps:
    - id: install
      shell: bash
      run: |
        set -euo pipefail

        # ------------------------------------------------------------
        # Install dependencies
        # ------------------------------------------------------------
        echo "Installing dependencies..."

        for dep in curl tar; do
          if ! command -v "${dep}" >/dev/null 2>&1; then
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache "${dep}"

            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y -qq "${dep}"

            elif command -v pacman >/dev/null 2>&1; then
              pacman -Sy --noconfirm "${dep}"

            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y "${dep}"

            elif command -v yum >/dev/null 2>&1; then
              yum install -y "${dep}"

            else
              echo "::error::Unable to install dependencies. No supported package manager found."
              exit 1
            fi
          fi
        done

        # ------------------------------------------------------------
        # Configuration
        # ------------------------------------------------------------
        REQUESTED_VERSION="${{ inputs.version }}"
        INSTALL_DIR="${{ inputs.install_dir }}"
        PKG_CACHE="${{ inputs.pkg_cache }}"

        # ------------------------------------------------------------
        # Skip install if the requested version is already present
        # ------------------------------------------------------------
        if command -v gitleaks >/dev/null 2>&1; then
          CURRENT_VERSION="$(gitleaks version 2>/dev/null | head -n1 | sed -E 's/^v//')"

          if [[ "${REQUESTED_VERSION}" == "latest" || "${REQUESTED_VERSION#v}" == "${CURRENT_VERSION#v}" ]]; then
            echo "Gitleaks ${CURRENT_VERSION} is already installed, skipping install."
            echo "version=${CURRENT_VERSION}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Gitleaks ${CURRENT_VERSION} is installed but ${REQUESTED_VERSION} was requested; reinstalling."
        fi

        # ------------------------------------------------------------
        # Resolve OS / architecture
        # ------------------------------------------------------------
        OS="$(uname -s | tr '[:upper:]' '[:lower:]')"

        case "${OS}" in
          linux|darwin)
            ;;
          *)
            echo "::error::Unsupported OS: ${OS}"
            exit 1
            ;;
        esac

        case "$(uname -m)" in
          x86_64|amd64)
            ARCH="x64"
            ;;
          aarch64|arm64)
            ARCH="arm64"
            ;;
          armv7l)
            ARCH="armv7"
            ;;
          *)
            echo "::error::Unsupported architecture: $(uname -m)"
            exit 1
            ;;
        esac

        # ------------------------------------------------------------
        # Resolve base URL (official GitHub or pkg-cache mirror)
        # ------------------------------------------------------------
        if [[ -n "${PKG_CACHE}" ]]; then
          PKG_CACHE_BASE="${PKG_CACHE}"
          case "${PKG_CACHE_BASE}" in
            http://*|https://*) ;;
            *) PKG_CACHE_BASE="https://${PKG_CACHE_BASE}" ;;
          esac
          PKG_CACHE_BASE="${PKG_CACHE_BASE%/}"

          BASE_URL="${PKG_CACHE_BASE}/github.com/gitleaks/gitleaks"
          API_BASE_URL="${PKG_CACHE_BASE}/api.github.com/repos/gitleaks/gitleaks"
          echo "Using pkg-cache mirror: ${BASE_URL}"
        else
          BASE_URL="https://github.com/gitleaks/gitleaks"
          API_BASE_URL="https://api.github.com/repos/gitleaks/gitleaks"
          echo "Using official Gitleaks releases"
        fi

        # ------------------------------------------------------------
        # Resolve version to install
        # ------------------------------------------------------------
        if [[ "${REQUESTED_VERSION}" == "latest" ]]; then
          VERSION="$(curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "${API_BASE_URL}/releases/latest" \
            | grep '"tag_name"' \
            | head -n1 \
            | sed -E 's/.*"v?([^"]+)".*/\1/')"

          if [[ -z "${VERSION}" ]]; then
            echo "::error::Unable to resolve latest Gitleaks version"
            exit 1
          fi
        else
          VERSION="${REQUESTED_VERSION#v}"
        fi

        echo "Installing Gitleaks ${VERSION} (${OS}-${ARCH})..."

        # ------------------------------------------------------------
        # Download and install
        # ------------------------------------------------------------
        TMP_DIR="$(mktemp -d)"
        trap 'rm -rf "${TMP_DIR}"' EXIT

        ASSET="gitleaks_${VERSION}_${OS}_${ARCH}.tar.gz"
        URL="${BASE_URL}/releases/download/v${VERSION}/${ASSET}"

        echo "Downloading ${URL}"

        if ! curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "${URL}" -o "${TMP_DIR}/${ASSET}"; then
          echo "::error::Failed to download Gitleaks ${VERSION} for ${OS}-${ARCH}. Check that the version exists: https://github.com/gitleaks/gitleaks/releases"
          exit 1
        fi

        if [[ ! -s "${TMP_DIR}/${ASSET}" ]]; then
          echo "::error::Gitleaks download is empty."
          exit 1
        fi

        tar -xzf "${TMP_DIR}/${ASSET}" -C "${TMP_DIR}" gitleaks

        if [[ ! -f "${TMP_DIR}/gitleaks" ]]; then
          echo "::error::Gitleaks binary was not found after extraction."
          exit 1
        fi

        if ! mkdir -p "${INSTALL_DIR}"; then
          echo "::error::Unable to create install directory: ${INSTALL_DIR}"
          exit 1
        fi

        if [[ -w "${INSTALL_DIR}" ]]; then
          mv "${TMP_DIR}/gitleaks" "${INSTALL_DIR}/gitleaks"
        else
          sudo mv "${TMP_DIR}/gitleaks" "${INSTALL_DIR}/gitleaks"
        fi

        chmod +x "${INSTALL_DIR}/gitleaks"

        # ------------------------------------------------------------
        # Make sure install_dir is on PATH for subsequent steps
        # ------------------------------------------------------------
        if [[ -n "${GITHUB_PATH:-}" ]]; then
          echo "${INSTALL_DIR}" >> "${GITHUB_PATH}"
        fi

        export PATH="${INSTALL_DIR}:${PATH}"

        # ------------------------------------------------------------
        # Verify install
        # ------------------------------------------------------------
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "::error::Gitleaks installation completed but binary is not on PATH."
          exit 1
        fi

        INSTALLED_VERSION="$("${INSTALL_DIR}/gitleaks" version 2>/dev/null | head -n1 | sed -E 's/^v//')"

        if [[ -z "${INSTALLED_VERSION}" ]]; then
          echo "::error::Unable to determine installed Gitleaks version."
          exit 1
        fi

        echo "✓ Gitleaks ${INSTALLED_VERSION} installed at ${INSTALL_DIR}/gitleaks"

        echo "version=${INSTALLED_VERSION}" >> "${GITHUB_OUTPUT}"