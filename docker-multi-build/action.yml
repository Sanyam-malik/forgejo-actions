name: Docker Build
description: Build Docker image

inputs:
  registry:
    description: Registry URL
    required: true

  namespace:
    description: Registry namespace
    required: true

  image:
    description: Image name
    required: true

  tag:
    description: Image tag
    required: false
    default: latest

  build_args:
    description: Additional docker build arguments
    required: false
    default: ""

  platforms:
    description: Comma-separated list of target platforms
    required: false
    default: linux/amd64,linux/arm64,linux/arm/v7

  on_unsupported_platform:
    description: What to do when a platform is not available. Allowed values are skip or error.
    required: false
    default: skip

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        # ------------------------------------------------------------
        # Install jq if it is not already installed.
        # Supports Alpine, Debian/Ubuntu, Arch, RHEL/Fedora/CentOS.
        # ------------------------------------------------------------
        if ! command -v jq >/dev/null 2>&1; then
          echo "jq not found. Installing..."

          if command -v apk >/dev/null 2>&1; then
            echo "Detected Alpine Linux"
            apk add --no-cache jq

          elif command -v apt-get >/dev/null 2>&1; then
            echo "Detected Debian/Ubuntu"
            apt-get update
            apt-get install -y jq

          elif command -v pacman >/dev/null 2>&1; then
            echo "Detected Arch Linux"
            pacman -Sy --noconfirm jq

          elif command -v dnf >/dev/null 2>&1; then
            echo "Detected Fedora/RHEL"
            dnf install -y jq

          elif command -v yum >/dev/null 2>&1; then
            echo "Detected CentOS/RHEL"
            yum install -y jq

          else
            echo "::error::jq is not installed and no supported package manager was found."
            exit 1
          fi
        else
          echo "jq is already installed: $(jq --version)"
        fi

        # ------------------------------------------------------------
        # Configuration
        # ------------------------------------------------------------
        REGISTRY="${{ inputs.registry }}"
        REGISTRY="${REGISTRY#http://}"
        REGISTRY="${REGISTRY#https://}"

        NAMESPACE="${{ inputs.namespace }}"
        IMAGE_NAME="${{ inputs.image }}"
        TAG="${{ inputs.tag }}"

        IMAGE="${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}:${TAG}"

        REQUESTED_PLATFORMS="${{ inputs.platforms }}"
        ON_UNSUPPORTED_PLATFORM="${{ inputs.on_unsupported_platform }}"

        # ------------------------------------------------------------
        # Validate inputs
        # ------------------------------------------------------------
        if [[ -z "${NAMESPACE}" ]]; then
          echo "::error::namespace input is empty"
          exit 1
        fi

        if [[ -z "${IMAGE_NAME}" ]]; then
          echo "::error::image input is empty"
          exit 1
        fi

        if [[ "${ON_UNSUPPORTED_PLATFORM}" != "skip" &&
              "${ON_UNSUPPORTED_PLATFORM}" != "error" ]]; then
          echo "::error::Invalid on_unsupported_platform '${ON_UNSUPPORTED_PLATFORM}'. Expected 'skip' or 'error'."
          exit 1
        fi

        # ------------------------------------------------------------
        # Create Buildx builder
        # ------------------------------------------------------------
        docker buildx create \
          --name docker-build \
          --use \
          --driver docker-container \
          >/dev/null 2>&1 || docker buildx use docker-build

        supported_platforms=""

        IFS=',' read -ra platforms <<< "${REQUESTED_PLATFORMS}"

        echo ""
        echo "Requested platforms: ${REQUESTED_PLATFORMS}"
        echo "On unsupported platform: ${ON_UNSUPPORTED_PLATFORM}"
        echo ""

        # ------------------------------------------------------------
        # Extract FROM images
        # ------------------------------------------------------------
        mapfile -t base_images < <(
          grep -Eih '^[[:space:]]*FROM[[:space:]]+' Dockerfile |
            sed -E 's/^[[:space:]]*FROM[[:space:]]+([^[:space:]]+).*/\1/' |
            grep -v '^\$' |
            sort -u
        )

        if [[ ${#base_images[@]} -eq 0 ]]; then
          echo "::error::No FROM image found in Dockerfile."
          exit 1
        fi

        echo "Base images:"
        printf '  %s\n' "${base_images[@]}"
        echo ""

        # ------------------------------------------------------------
        # Check each requested platform
        # ------------------------------------------------------------
        for platform in "${platforms[@]}"; do
          platform="$(echo "${platform}" | xargs)"

          [[ -z "${platform}" ]] && continue

          echo "Checking platform: ${platform}"

          platform_supported=true

          for base_image in "${base_images[@]}"; do
            echo "  Checking ${base_image}..."

            manifest="$(
              docker buildx imagetools inspect \
                "${base_image}" \
                --raw 2>/dev/null || true
            )"

            if [[ -z "${manifest}" ]]; then
              echo "  ✗ Unable to inspect ${base_image}"
              platform_supported=false
              break
            fi

            os="${platform%%/*}"
            remaining="${platform#*/}"
            arch="${remaining%%/*}"
            variant=""

            if [[ "${remaining}" == */* ]]; then
              variant="${remaining#*/}"
            fi

            found=false

            while IFS= read -r manifest_platform; do
              [[ -z "${manifest_platform}" ]] && continue

              manifest_os="$(echo "${manifest_platform}" | jq -r '.os // empty')"
              manifest_arch="$(echo "${manifest_platform}" | jq -r '.architecture // empty')"
              manifest_variant="$(echo "${manifest_platform}" | jq -r '.variant // empty')"

              if [[ "${manifest_os}" == "${os}" &&
                    "${manifest_arch}" == "${arch}" ]]; then

                if [[ -z "${variant}" ||
                      "${manifest_variant}" == "${variant}" ]]; then
                  found=true
                  break
                fi
              fi
            done < <(
              echo "${manifest}" |
                jq -c '.manifests[]? | .platform // empty'
            )

            if [[ "${found}" == "true" ]]; then
              echo "  ✓ ${base_image} provides ${platform}"
            else
              echo "  ✗ ${base_image} does not provide ${platform}"
              platform_supported=false
              break
            fi
          done

          if [[ "${platform_supported}" == "true" ]]; then
            echo "✓ ${platform} image can be built"

            if [[ -z "${supported_platforms}" ]]; then
              supported_platforms="${platform}"
            else
              supported_platforms="${supported_platforms},${platform}"
            fi
          else
            if [[ "${ON_UNSUPPORTED_PLATFORM}" == "skip" ]]; then
              echo "::warning::${platform} image cannot be built, skipping platform"
            else
              echo "::error::${platform} image cannot be built"
              exit 1
            fi
          fi

          echo ""
        done

        # ------------------------------------------------------------
        # Make sure at least one platform remains
        # ------------------------------------------------------------
        if [[ -z "${supported_platforms}" ]]; then
          echo "::error::None of the requested platforms are available."
          exit 1
        fi

        echo "Supported platforms: ${supported_platforms}"
        echo "Building and pushing: ${IMAGE}"
        echo ""

        # ------------------------------------------------------------
        # Final multi-platform build
        # ------------------------------------------------------------
        docker buildx build \
          --builder docker-build \
          --platform "${supported_platforms}" \
          ${{ inputs.build_args }} \
          -t "${IMAGE}" \
          --output type=image,push=true \
          .
