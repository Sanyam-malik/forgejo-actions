name: Docker Multi Image Build
description: Build a multi-architecture Docker image to an OCI tar archive with platform validation and alias support

inputs:
  registry:
    description: Registry URL
    required: true

  namespace:
    description: Registry namespace
    required: true

  image:
    description: Image name
    required: true

  tag:
    description: Image tag
    required: false
    default: latest

  dockerfile:
    description: Path to the Dockerfile to build
    required: false
    default: Dockerfile

  build_args:
    description: Additional docker build arguments
    required: false
    default: ""

  platforms:
    description: Comma-separated list of target platforms to build (supports aliases like armhf, armv7, x86_64, aarch64)
    required: false
    default: linux/amd64,linux/arm64,linux/arm/v7

  validate_platforms:
    description: Whether to validate platform buildability before building
    required: false
    default: "true"

  disable_process_sandbox:
    description: >
      Create the Buildx builder with BuildKit's process sandbox
      disabled (--oci-worker-no-process-sandbox). Required for tools
      that write out and directly execute native helper binaries
      during the build (e.g. GraalVM native-image), which BuildKit's
      default process sandbox blocks. Only enable this for builds that
      specifically need it; leave disabled for normal builds so they
      keep the default hardened sandbox.
    required: false
    default: "false"

outputs:
  image:
    description: Fully resolved image reference embedded in the archive (registry/namespace/image:tag)
    value: ${{ steps.build.outputs.image }}

  supported_platforms:
    description: Comma-separated list of platforms that were validated and built
    value: ${{ steps.build.outputs.supported_platforms }}

runs:
  using: composite

  steps:
    - id: build
      name: Build Docker image
      shell: bash
      env:
        REGISTRY_INPUT: ${{ inputs.registry }}
        NAMESPACE_INPUT: ${{ inputs.namespace }}
        IMAGE_NAME_INPUT: ${{ inputs.image }}
        TAG: ${{ inputs.tag }}
        DOCKERFILE_INPUT: ${{ inputs.dockerfile }}
        BUILD_ARGS: ${{ inputs.build_args }}
        REQUESTED_PLATFORMS: ${{ inputs.platforms }}
        VALIDATE_PLATFORMS: ${{ inputs.validate_platforms }}
        DISABLE_PROCESS_SANDBOX: ${{ inputs.disable_process_sandbox }}
      run: |
        set -euo pipefail

        # ------------------------------------------------------------
        # Normalize configuration
        # ------------------------------------------------------------
        REGISTRY="${REGISTRY_INPUT}"
        REGISTRY="${REGISTRY#http://}"
        REGISTRY="${REGISTRY#https://}"
        REGISTRY="${REGISTRY%/}"

        NAMESPACE="${NAMESPACE_INPUT}"
        NAMESPACE="${NAMESPACE#/}"
        NAMESPACE="${NAMESPACE%/}"

        IMAGE_NAME="${IMAGE_NAME_INPUT}"
        IMAGE_NAME="${IMAGE_NAME#/}"
        IMAGE_NAME="${IMAGE_NAME%/}"

        TAG="${TAG:-latest}"

        DOCKERFILE="${DOCKERFILE_INPUT}"

        # ------------------------------------------------------------
        # Validate inputs
        # ------------------------------------------------------------
        if [[ -z "${REGISTRY}" ]]; then
          echo "::error::registry input is empty"
          exit 1
        fi

        if [[ -z "${NAMESPACE}" ]]; then
          echo "::error::namespace input is empty"
          exit 1
        fi

        if [[ -z "${IMAGE_NAME}" ]]; then
          echo "::error::image input is empty"
          exit 1
        fi

        if [[ -z "${TAG}" ]]; then
          echo "::error::tag input is empty"
          exit 1
        fi

        if [[ -z "${DOCKERFILE}" ]]; then
          echo "::error::dockerfile input is empty"
          exit 1
        fi

        if [[ ! -f "${DOCKERFILE}" ]]; then
          echo "::error::Dockerfile not found at path: ${DOCKERFILE}"
          exit 1
        fi

        if [[ -z "${REQUESTED_PLATFORMS}" ]]; then
          echo "::error::platforms input is empty. Nothing to build."
          exit 1
        fi

        # ------------------------------------------------------------
        # Resolve image reference
        #
        # Example:
        #   ghcr.io/my-org/my-app:1.2.3
        # ------------------------------------------------------------
        IMAGE="${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}:${TAG}"

        # ------------------------------------------------------------
        # Derive OCI tarball filename from image reference
        #
        # Example:
        #   ghcr.io/my-org/my-app:1.2.3
        #
        # becomes:
        #   ghcr.io_my-org_my-app_1.2.3.oci.tar
        # ------------------------------------------------------------
        OCI_FILENAME="$(
          printf '%s' "${IMAGE}" |
            sed 's#[/:@]#_#g'
        ).oci.tar"

        OUTPUT_PATH="${OCI_FILENAME}"

        # ------------------------------------------------------------
        # Normalize and map platform aliases
        # ------------------------------------------------------------
        normalize_platform() {
          local raw_p="$1"
          local p
          p="$(echo "${raw_p}" | xargs)"
          p="$(echo "${p}" | tr '[:upper:]' '[:lower:]')"

          case "${p}" in
            linux/arm/v7|linux/arm/7|linux/armv7|linux/armv7l|linux/armhf|arm/v7|arm/7|armv7|armv7l|armhf)
              echo "linux/arm/v7"
              ;;
            linux/arm/v6|linux/arm/6|linux/armv6|linux/armv6l|linux/armel|arm/v6|arm/6|armv6|armv6l|armel)
              echo "linux/arm/v6"
              ;;
            linux/arm64|linux/arm64/v8|linux/arm/v8|linux/aarch64|arm64|aarch64|arm64/v8|arm/v8)
              echo "linux/arm64"
              ;;
            linux/amd64|linux/x86_64|linux/x86-64|linux/x64|amd64|x86_64|x86-64|x64)
              echo "linux/amd64"
              ;;
            linux/386|linux/i386|linux/x86|386|i386|x86)
              echo "linux/386"
              ;;
            linux/ppc64le|ppc64le|linux/ppc64|ppc64)
              echo "linux/ppc64le"
              ;;
            linux/s390x|s390x)
              echo "linux/s390x"
              ;;
            linux/riscv64|riscv64)
              echo "linux/riscv64"
              ;;
            *)
              if [[ -n "${p}" ]]; then
                if [[ "${p}" != *"/"* ]]; then
                  echo "linux/${p}"
                else
                  echo "${p}"
                fi
              fi
              ;;
          esac
        }

        IFS=',' read -ra RAW_PLATFORMS <<< "${REQUESTED_PLATFORMS}"
        NORMALIZED_PLATFORMS=()

        for raw_p in "${RAW_PLATFORMS[@]}"; do
          norm_p="$(normalize_platform "${raw_p}")"
          [[ -z "${norm_p}" ]] && continue
          if [[ ! " ${NORMALIZED_PLATFORMS[*]:-} " =~ " ${norm_p} " ]]; then
            NORMALIZED_PLATFORMS+=("${norm_p}")
          fi
        done

        if [[ "${#NORMALIZED_PLATFORMS[@]}" -eq 0 ]]; then
          echo "::error::No valid platforms resolved from input: ${REQUESTED_PLATFORMS}"
          exit 1
        fi

        # ------------------------------------------------------------
        # Parse extra build args (once, reused for both validation and
        # the final build)
        #
        # BUILD_ARGS is a single string of shell-quoted tokens, e.g.:
        #   --build-arg FOO=bar --build-arg BAZ="some value"
        #
        # We use `eval` (scoped to array assignment only, not the whole
        # script) so that quoting in BUILD_ARGS is respected instead of
        # naively splitting on every whitespace character. Plain
        # `( ${BUILD_ARGS} )` word-splits on ANY whitespace, including
        # whitespace inside an unquoted value (e.g. a literal, unexpanded
        # "$(date +%s)" left over from a workflow that expected shell
        # command substitution to run inside YAML, which it does not).
        # That kind of stray whitespace silently produces extra
        # positional arguments to `docker buildx build`, which then
        # fails with a confusing "requires 1 argument" error pointing at
        # the wrong place. We fail loudly here instead.
        # ------------------------------------------------------------
        EXTRA_BUILD_ARGS=()

        if [[ -n "${BUILD_ARGS}" ]]; then
          if ! eval "EXTRA_BUILD_ARGS=(${BUILD_ARGS})" 2>/tmp/build_args_error; then
            echo "::error::Failed to parse build_args input as shell arguments."
            echo "::error::build_args was: ${BUILD_ARGS}"
            cat /tmp/build_args_error >&2 || true
            exit 1
          fi

          # Sanity check: every parsed token that looks like a value
          # (comes right after --build-arg) must not itself start with
          # "--", and every --build-arg must be followed by a value.
          # This catches cases where unquoted whitespace inside a value
          # fractured it into multiple tokens.
          for (( i=0; i<${#EXTRA_BUILD_ARGS[@]}; i++ )); do
            token="${EXTRA_BUILD_ARGS[$i]}"
            if [[ "${token}" == "--build-arg" ]]; then
              next_index=$(( i + 1 ))
              if (( next_index >= ${#EXTRA_BUILD_ARGS[@]} )); then
                echo "::error::--build-arg in build_args has no following value."
                echo "::error::build_args was: ${BUILD_ARGS}"
                exit 1
              fi
              value="${EXTRA_BUILD_ARGS[$next_index]}"
              if [[ "${value}" == --* ]]; then
                echo "::error::--build-arg appears to be followed by another flag ('${value}') instead of a KEY=VALUE pair."
                echo "::error::This usually means a value in build_args contained unquoted whitespace and got split apart."
                echo "::error::build_args was: ${BUILD_ARGS}"
                exit 1
              fi
            fi
          done
        fi

        # ------------------------------------------------------------
        # Buildx builder name
        # ------------------------------------------------------------
        if command -v uuidgen >/dev/null 2>&1; then
          UUID="$(uuidgen)"
        elif [[ -r /proc/sys/kernel/random/uuid ]]; then
          UUID="$(cat /proc/sys/kernel/random/uuid)"
        else
          UUID="$(date +%s%N)-${RANDOM}"
        fi

        BUILDER_NAME="build_${UUID}"

        # ------------------------------------------------------------
        # Cleanup
        #
        # Always runs because it is registered with EXIT.
        # ------------------------------------------------------------
        cleanup() {
          local exit_code=$?

          echo ""
          echo "============================================================"
          echo "Buildx cleanup"
          echo "============================================================"

          if docker buildx inspect "${BUILDER_NAME}" >/dev/null 2>&1; then
            echo "Removing Buildx builder: ${BUILDER_NAME}"

            docker buildx rm \
              --force \
              "${BUILDER_NAME}" \
              >/dev/null 2>&1 || \
              echo "::warning::Failed to remove Buildx builder: ${BUILDER_NAME}"
          else
            echo "Buildx builder already removed: ${BUILDER_NAME}"
          fi

          echo "Buildx cleanup completed."

          exit "${exit_code}"
        }

        trap cleanup EXIT

        # ------------------------------------------------------------
        # Create isolated Buildx builder
        #
        # If disable_process_sandbox is enabled, the builder is created
        # with BuildKit's process sandbox turned off
        # (--oci-worker-no-process-sandbox). BuildKit's default OCI
        # worker sandboxes each RUN step's process beyond normal
        # container privileges; some tools need to write out a native
        # helper binary during the build and directly execute it (e.g.
        # GraalVM native-image, which does this to compute C struct
        # layout offsets), and that write-then-exec pattern is blocked
        # by the default sandbox even when the container itself has
        # ordinary permissions, producing errors like:
        #   "Unable to run '.../SomeDirectives' to compute offsets"
        #
        # This is a real (if narrow) reduction in build isolation, so
        # it stays strictly opt-in via the disable_process_sandbox
        # input; leave it disabled for builds that don't need it.
        # ------------------------------------------------------------
        echo "============================================================"
        echo "Docker Multi Image Build"
        echo "============================================================"
        echo "Image reference       : ${IMAGE}"
        echo "Dockerfile            : ${DOCKERFILE}"
        echo "Requested platforms   : ${REQUESTED_PLATFORMS}"
        echo "Normalized platforms  : ${NORMALIZED_PLATFORMS[*]}"
        echo "OCI tarball           : ${OUTPUT_PATH}"
        echo "Buildx builder        : ${BUILDER_NAME}"
        echo "Process sandbox off   : ${DISABLE_PROCESS_SANDBOX}"
        echo "============================================================"
        echo ""

        echo "Creating Buildx builder..."

        CREATE_COMMAND=(
          docker buildx create
          --name "${BUILDER_NAME}"
          --use
          --driver docker-container
        )

        if [[ "${DISABLE_PROCESS_SANDBOX}" == "true" ]]; then
          CREATE_COMMAND+=( --buildkitd-flags '--oci-worker-no-process-sandbox' )
        fi

        "${CREATE_COMMAND[@]}" >/dev/null

        echo "Buildx builder created: ${BUILDER_NAME}"
        echo ""

        # ------------------------------------------------------------
        # Validate platforms if enabled
        # ------------------------------------------------------------
        SUPPORTED_PLATFORMS=""

        if [[ "${VALIDATE_PLATFORMS}" == "true" ]]; then
          echo "============================================================"
          echo "Validating platform buildability"
          echo "============================================================"

          for platform in "${NORMALIZED_PLATFORMS[@]}"; do
            echo "Checking platform: ${platform}"

            CHECK_COMMAND=(
              docker buildx build
              --builder "${BUILDER_NAME}"
              --platform "${platform}"
              --file "${DOCKERFILE}"
              --output type=cacheonly
            )

            if (( ${#EXTRA_BUILD_ARGS[@]} > 0 )); then
              CHECK_COMMAND+=( "${EXTRA_BUILD_ARGS[@]}" )
            fi

            CHECK_COMMAND+=( "." )

            if "${CHECK_COMMAND[@]}"; then
              echo "✓ ${platform} image can be built"
              if [[ -z "${SUPPORTED_PLATFORMS}" ]]; then
                SUPPORTED_PLATFORMS="${platform}"
              else
                SUPPORTED_PLATFORMS="${SUPPORTED_PLATFORMS},${platform}"
              fi
            else
              echo "::warning::${platform} image cannot be built, skipping platform"
            fi
            echo ""
          done

          if [[ -z "${SUPPORTED_PLATFORMS}" ]]; then
            echo "::error::None of the requested platforms can be built."
            exit 1
          fi
        else
          SUPPORTED_PLATFORMS="$(IFS=','; echo "${NORMALIZED_PLATFORMS[*]}")"
        fi

        # ------------------------------------------------------------
        # Build command
        # ------------------------------------------------------------
        BUILD_COMMAND=(
          docker buildx build
          --builder "${BUILDER_NAME}"
          --platform "${SUPPORTED_PLATFORMS}"
          --tag "${IMAGE}"
          --file "${DOCKERFILE}"
          --output "type=oci,dest=${OUTPUT_PATH}"
        )

        if (( ${#EXTRA_BUILD_ARGS[@]} > 0 )); then
          BUILD_COMMAND+=( "${EXTRA_BUILD_ARGS[@]}" )
        fi

        BUILD_COMMAND+=( "." )

        # ------------------------------------------------------------
        # Build OCI archive
        # ------------------------------------------------------------
        echo "============================================================"
        echo "Building OCI image tarball for platforms: ${SUPPORTED_PLATFORMS}"
        echo "============================================================"
        echo ""

        "${BUILD_COMMAND[@]}"

        # ------------------------------------------------------------
        # Verify OCI tarball
        # ------------------------------------------------------------
        if [[ ! -f "${OUTPUT_PATH}" ]]; then
          echo "::error::OCI image tarball was not created: ${OUTPUT_PATH}"
          exit 1
        fi

        if [[ ! -s "${OUTPUT_PATH}" ]]; then
          echo "::error::OCI image tarball is empty: ${OUTPUT_PATH}"
          exit 1
        fi

        SIZE="$(
          du -h "${OUTPUT_PATH}" |
            cut -f1
        )"

        # ------------------------------------------------------------
        # Success
        # ------------------------------------------------------------
        echo ""
        echo "============================================================"
        echo "OCI image build completed successfully"
        echo "============================================================"
        echo "Image reference : ${IMAGE}"
        echo "Dockerfile      : ${DOCKERFILE}"
        echo "Platforms       : ${SUPPORTED_PLATFORMS}"
        echo "OCI tarball     : ${OUTPUT_PATH}"
        echo "Size            : ${SIZE}"
        echo "============================================================"

        # ------------------------------------------------------------
        # Action outputs
        # ------------------------------------------------------------
        echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
        echo "supported_platforms=${SUPPORTED_PLATFORMS}" >> "${GITHUB_OUTPUT}"