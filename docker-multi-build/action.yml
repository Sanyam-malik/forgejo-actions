name: Docker Push
description: Build and push a Docker image for a given set of platforms

inputs:
  registry:
    description: Registry URL
    required: true

  namespace:
    description: Registry namespace
    required: true

  image:
    description: Image name
    required: true

  tag:
    description: Image tag
    required: false
    default: latest

  build_args:
    description: Additional docker build arguments
    required: false
    default: ""

  platforms:
    description: Comma-separated list of platforms to build and push (e.g. output of the platform-check action)
    required: true

  builder_name:
    description: Name of an existing Buildx builder to reuse (e.g. output of the platform-check action). If omitted, a new random builder is created and removed after the build.
    required: false
    default: ""

runs:
  using: composite

  steps:
    - shell: bash
      run: |
        set -euo pipefail

        # ------------------------------------------------------------
        # Configuration
        # ------------------------------------------------------------
        REGISTRY="${{ inputs.registry }}"
        REGISTRY="${REGISTRY#http://}"
        REGISTRY="${REGISTRY#https://}"

        NAMESPACE="${{ inputs.namespace }}"
        IMAGE_NAME="${{ inputs.image }}"
        TAG="${{ inputs.tag }}"

        PLATFORMS="${{ inputs.platforms }}"
        BUILDER_NAME="${{ inputs.builder_name }}"

        # ------------------------------------------------------------
        # Validate inputs
        # ------------------------------------------------------------
        if [[ -z "${REGISTRY}" ]]; then
          echo "::error::registry input is empty"
          exit 1
        fi

        if [[ -z "${NAMESPACE}" ]]; then
          echo "::error::namespace input is empty"
          exit 1
        fi

        if [[ -z "${IMAGE_NAME}" ]]; then
          echo "::error::image input is empty"
          exit 1
        fi

        if [[ -z "${PLATFORMS}" ]]; then
          echo "::error::platforms input is empty. Nothing to build."
          exit 1
        fi

        IMAGE="${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}:${TAG}"

        # ------------------------------------------------------------
        # Buildx builder
        # ------------------------------------------------------------
        # If builder_name was passed in (e.g. from the platform-check
        # action), reuse it so build cache from that step carries
        # over, and leave its lifecycle to whoever created it — do
        # NOT remove it here.
        #
        # If no builder_name was given (standalone run), generate a
        # random one so concurrent runs on the same runner never
        # collide, and clean it up unconditionally since this action
        # is the sole owner of it.
        # ------------------------------------------------------------
        OWNS_BUILDER=false

        if [[ -z "${BUILDER_NAME}" ]]; then
          if command -v uuidgen >/dev/null 2>&1; then
            UUID="$(uuidgen)"
          elif [[ -r /proc/sys/kernel/random/uuid ]]; then
            UUID="$(cat /proc/sys/kernel/random/uuid)"
          else
            UUID="$(date +%s%N)-${RANDOM}"
          fi

          BUILDER_NAME="build_${UUID}"
          OWNS_BUILDER=true

          docker buildx create \
            --name "${BUILDER_NAME}" \
            --use \
            --driver docker-container \
            >/dev/null 2>&1
        else
          docker buildx use "${BUILDER_NAME}"
        fi

        echo "Builder name: ${BUILDER_NAME}"

        cleanup() {
          if [[ "${OWNS_BUILDER}" == "true" ]]; then
            echo ""
            echo "============================================================"
            echo "Cleaning up Buildx builder"
            echo "============================================================"

            docker buildx rm --force "${BUILDER_NAME}" >/dev/null 2>&1 || true

            echo "Buildx cleanup completed."
          fi
        }

        trap cleanup EXIT

        echo "============================================================"
        echo "Building and pushing: ${IMAGE}"
        echo "Platforms: ${PLATFORMS}"
        echo "============================================================"
        echo ""

        # ------------------------------------------------------------
        # Build and push
        #
        # This is the ONLY command that pushes an image.
        # No platform-specific tags are created; buildx pushes a
        # single manifest list covering all requested platforms.
        # ------------------------------------------------------------
        docker buildx build \
          --builder "${BUILDER_NAME}" \
          --platform "${PLATFORMS}" \
          ${{ inputs.build_args }} \
          -t "${IMAGE}" \
          --output type=image,push=true \
          .