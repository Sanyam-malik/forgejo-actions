name: Docker Build
description: Build Docker image

inputs:
  registry:
    description: Registry URL
    required: true

  namespace:
    description: Registry namespace
    required: true

  image:
    description: Image name
    required: true

  tag:
    description: Image tag
    required: false
    default: latest

  build_args:
    description: Additional docker build arguments
    required: false
    default: ""

  platforms:
    description: Comma-separated list of target platforms
    required: false
    default: linux/amd64,linux/arm64,linux/arm/v7

  on_unsupported_platform:
    description: What to do when a platform cannot be built. Allowed values are skip or error.
    required: false
    default: skip

runs:
  using: composite

  steps:
    - shell: bash
      run: |
        set -euo pipefail

        # ------------------------------------------------------------
        # Install dependencies
        # ------------------------------------------------------------
        echo "Installing dependencies..."

        if ! command -v jq >/dev/null 2>&1; then
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache jq

          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq jq

          elif command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm jq

          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y jq

          elif command -v yum >/dev/null 2>&1; then
            yum install -y jq

          else
            echo "::error::Unable to install dependencies. No supported package manager found."
            exit 1
          fi
        fi

        # ------------------------------------------------------------
        # Configuration
        # ------------------------------------------------------------
        REGISTRY="${{ inputs.registry }}"
        REGISTRY="${REGISTRY#http://}"
        REGISTRY="${REGISTRY#https://}"

        NAMESPACE="${{ inputs.namespace }}"
        IMAGE_NAME="${{ inputs.image }}"
        TAG="${{ inputs.tag }}"

        REQUESTED_PLATFORMS="${{ inputs.platforms }}"
        ON_UNSUPPORTED_PLATFORM="${{ inputs.on_unsupported_platform }}"

        if [[ -z "${REGISTRY}" ]]; then
          echo "::error::registry input is empty"
          exit 1
        fi

        if [[ -z "${NAMESPACE}" ]]; then
          echo "::error::namespace input is empty"
          exit 1
        fi

        if [[ -z "${IMAGE_NAME}" ]]; then
          echo "::error::image input is empty"
          exit 1
        fi

        if [[ "${ON_UNSUPPORTED_PLATFORM}" != "skip" &&
              "${ON_UNSUPPORTED_PLATFORM}" != "error" ]]; then
          echo "::error::Invalid on_unsupported_platform '${ON_UNSUPPORTED_PLATFORM}'. Expected 'skip' or 'error'."
          exit 1
        fi

        IMAGE="${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}:${TAG}"

        # ------------------------------------------------------------
        # Create Buildx builder
        # ------------------------------------------------------------
        docker buildx create \
          --name docker-build \
          --use \
          --driver docker-container \
          >/dev/null 2>&1 || docker buildx use docker-build

        # ------------------------------------------------------------
        # Parse platforms
        # ------------------------------------------------------------
        IFS=',' read -ra platforms <<< "${REQUESTED_PLATFORMS}"

        built_images=()

        echo ""
        echo "Requested platforms: ${REQUESTED_PLATFORMS}"
        echo "On unsupported platform: ${ON_UNSUPPORTED_PLATFORM}"
        echo "Image: ${IMAGE}"
        echo ""

        # ------------------------------------------------------------
        # Build each platform independently
        # ------------------------------------------------------------
        for platform in "${platforms[@]}"; do
          platform="$(echo "${platform}" | xargs)"

          [[ -z "${platform}" ]] && continue

          # Convert platform into a safe temporary tag.
          #
          # linux/amd64   -> amd64
          # linux/arm64   -> arm64
          # linux/arm/v7  -> arm-v7
          #
          platform_tag="${platform//\//-}"

          temporary_image="${IMAGE}-${platform_tag}"

          echo "============================================================"
          echo "Building platform: ${platform}"
          echo "Temporary image: ${temporary_image}"
          echo "============================================================"
          echo ""

          build_log="$(mktemp)"

          if docker buildx build \
              --builder docker-build \
              --platform "${platform}" \
              ${{ inputs.build_args }} \
              -t "${temporary_image}" \
              --output type=image,push=true \
              . \
              2>&1 | tee "${build_log}"; then

            echo ""
            echo "✓ ${platform} image built successfully"

            built_images+=("${temporary_image}")

          else
            echo ""
            echo "✗ ${platform} image cannot be built"

            if [[ "${ON_UNSUPPORTED_PLATFORM}" == "skip" ]]; then
              echo "::warning::${platform} image cannot be built, skipping platform"
            else
              echo "::error::${platform} image cannot be built"
              rm -f "${build_log}"
              exit 1
            fi
          fi

          rm -f "${build_log}"

          echo ""
        done

        # ------------------------------------------------------------
        # Make sure at least one platform succeeded
        # ------------------------------------------------------------
        if [[ ${#built_images[@]} -eq 0 ]]; then
          echo "::error::None of the requested platforms could be built."
          exit 1
        fi

        echo "Successfully built platforms:"
        printf '  %s\n' "${built_images[@]}"
        echo ""

        # ------------------------------------------------------------
        # Create final multi-platform manifest
        # ------------------------------------------------------------
        echo "Creating multi-platform image:"
        echo "${IMAGE}"
        echo ""

        docker buildx imagetools create \
          -t "${IMAGE}" \
          "${built_images[@]}"

        echo ""
        echo "✓ Multi-platform image created successfully"
        echo "  ${IMAGE}"