name: Docker Push
description: Load an OCI image tarball and push the image to a registry

inputs:
  registry:
    description: Registry URL
    required: true

  namespace:
    description: Registry namespace
    required: true

  image:
    description: Image name
    required: true

  tags:
    description: Comma-separated image tags
    required: false
    default: latest

runs:
  using: composite

  steps:
    - shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        NAMESPACE: ${{ inputs.namespace }}
        IMAGE_NAME: ${{ inputs.image }}
        TAGS_INPUT: ${{ inputs.tags }}
      run: |
        set -euo pipefail

        # ------------------------------------------------------------
        # Normalize registry
        # ------------------------------------------------------------
        REGISTRY="${REGISTRY#http://}"
        REGISTRY="${REGISTRY#https://}"
        REGISTRY="${REGISTRY%/}"

        # ------------------------------------------------------------
        # Build image references
        # ------------------------------------------------------------
        if [[ -z "${TAGS_INPUT}" ]]; then
          echo "::error::tags input is empty"
          exit 1
        fi

        IFS=',' read -ra TAG_LIST <<< "${TAGS_INPUT}"
        IMAGE_REFS=()
        for raw_tag in "${TAG_LIST[@]}"; do
          tag="$(printf '%s' "${raw_tag}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ -z "${tag}" ]]; then
            echo "::error::tags contains an empty tag"
            exit 1
          fi
          if [[ "${tag}" =~ [[:space:]] ]]; then
            echo "::error::Invalid image tag: '${tag}'"
            exit 1
          fi
          IMAGE_REFS+=( "${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}:${tag}" )
        done

        IMAGE_REF="${IMAGE_REFS[0]}"

        echo "Image references:"
        printf '  %s\n' "${IMAGE_REFS[@]}"

        # ------------------------------------------------------------
        # Resolve OCI tar filename
        #
        # Must match the filename generated by the Docker OCI
        # build action.
        #
        # Example:
        #   ghcr.io/my-org/my-app:v1.2.3
        #
        # becomes:
        #   ghcr.io_my-org_my-app_v1.2.3.oci.tar
        # ------------------------------------------------------------
        OCI_FILENAME="$(
          printf '%s' "${IMAGE_REF}" |
          sed 's#[/:@]#_#g'
        ).oci.tar"

        echo "OCI image:"
        echo "  ${OCI_FILENAME}"

        # ------------------------------------------------------------
        # Verify OCI archive exists
        # ------------------------------------------------------------
        if [[ ! -f "${OCI_FILENAME}" ]]; then
          echo "::error::OCI image tarball not found: ${OCI_FILENAME}"
          echo "::error::Expected image reference: ${IMAGE_REF}"
          exit 1
        fi

        echo "OCI image tarball found."
        echo "Size: $(du -h "${OCI_FILENAME}" | cut -f1)"

        # ------------------------------------------------------------
        # Load OCI image
        #
        # Docker's `load` imports the OCI archive into the local
        # Docker image store.
        # ------------------------------------------------------------
        echo "Loading OCI image into Docker..."

        docker load \
          --input "${OCI_FILENAME}"

        echo "OCI image loaded successfully."

        # ------------------------------------------------------------
        # Verify image exists locally
        # ------------------------------------------------------------
        if ! docker image inspect "${IMAGE_REF}" >/dev/null 2>&1; then
          echo "::error::Loaded image was not found locally: ${IMAGE_REF}"
          echo ""
          echo "Available images:"
          docker images
          exit 1
        fi

        echo "Local image verified:"
        docker image inspect \
          "${IMAGE_REF}" \
          --format '{{.Id}}'

        for image_ref in "${IMAGE_REFS[@]:1}"; do
          docker tag "${IMAGE_REF}" "${image_ref}"
        done

        # ------------------------------------------------------------
        # Push image
        # ------------------------------------------------------------
        echo ""
        echo "Pushing images to registry..."
        for image_ref in "${IMAGE_REFS[@]}"; do
          echo "  ${image_ref}"
          docker push "${image_ref}"
        done

        echo ""
        echo "Images pushed successfully:"
        printf '  %s\n' "${IMAGE_REFS[@]}"

        # ------------------------------------------------------------
        # Cleanup
        # ------------------------------------------------------------
        echo ""
        echo "Removing local Docker image to free space..."

        docker rmi "${IMAGE_REFS[@]}" || true

        echo "Removing OCI tarball..."

        rm -f "${OCI_FILENAME}" || true

        echo "Cleanup complete."