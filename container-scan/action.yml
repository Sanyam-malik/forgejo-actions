name: Trivy Container Scan
description: >
  Scan a container image with Trivy, produce JSON and table reports, fail
  on defined severity rules, and post/update a PR comment with the results.
  This wraps run-vulnerability-scan (scan_type: image) plus post-comment.

inputs:
  image:
    description: Image reference to scan (e.g. registry.example.com/org/app:tag)
    required: true

  severity:
    description: Comma-separated severities to include in the scan/report (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)
    required: false
    default: CRITICAL,HIGH,MEDIUM

  fail_on:
    description: Comma-separated subset of "severity" that causes the action to fail if found. Must be a subset of "severity" to have any effect. Leave empty to report only and never fail the build.
    required: false
    default: CRITICAL,HIGH,MEDIUM

  vuln_type:
    description: Comma-separated vulnerability types to scan (os, library)
    required: false
    default: os,library

  ignore_unfixed:
    description: Ignore vulnerabilities with no available fix
    required: false
    default: "false"

  output_dir:
    description: Directory to write the JSON and table reports into
    required: false
    default: trivy-results

  trivy_version:
    description: Trivy version to install if trivy is not already on PATH
    required: false
    default: latest

  pkg_cache:
    description: Package cache host or base URL to install Trivy through, if an install is needed
    required: false
    default: ""

  fail_build:
    description: Fail this action when matching vulnerabilities are found or the scan errors out.
    required: false
    default: "true"

  post_pr_comment:
    description: Post (or update) a pull request comment summarizing the scan results.
    required: false
    default: "true"

outputs:
  json_report:
    description: Path to the JSON report
    value: ${{ steps.scan.outputs.json_report }}

  table_report:
    description: Path to the table report
    value: ${{ steps.scan.outputs.table_report }}

  vulnerability_count:
    description: Number of vulnerabilities matching fail_on severities
    value: ${{ steps.scan.outputs.vulnerability_count }}

  pr_comment_action:
    description: One of "created", "updated", or "skipped".
    value: ${{ steps.pr-comment.outputs.action }}

runs:
  using: composite

  steps:
    - id: scan
      name: Scan image
      uses: ${{ github.action_repository }}/run-vulnerability-scan@${{ github.action_ref }}
      with:
        scan_type: image
        target: ${{ inputs.image }}
        severity: ${{ inputs.severity }}
        fail_on: ${{ inputs.fail_on }}
        vuln_type: ${{ inputs.vuln_type }}
        ignore_unfixed: ${{ inputs.ignore_unfixed }}
        output_dir: ${{ inputs.output_dir }}
        trivy_version: ${{ inputs.trivy_version }}
        pkg_cache: ${{ inputs.pkg_cache }}
        fail_build: ${{ inputs.fail_build }}

    # ============================================================
    # Build PR comment body
    #
    # Runs even if the scan step above failed (fail_build: true),
    # since its outputs are still populated - the comment should
    # still go out to report what was found.
    # ============================================================
    - id: build-summary
      name: Build scan summary
      if: always()
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        SEVERITY: ${{ inputs.severity }}
        FAIL_ON: ${{ inputs.fail_on }}
        JSON_REPORT: ${{ steps.scan.outputs.json_report }}
        VULNERABILITY_COUNT: ${{ steps.scan.outputs.vulnerability_count }}
        TOTAL_VULNERABILITY_COUNT: ${{ steps.scan.outputs.total_vulnerability_count }}
        SCAN_ERROR: ${{ steps.scan.outputs.scan_error }}
      run: |
        set -uo pipefail

        SUMMARY="${RUNNER_TEMP}/trivy-container-scan-summary.md"

        {
          echo "## 🛡️ Trivy Container Scan"
          echo ""
          echo "**Image:** \`${IMAGE}\`"
          echo ""

          if [[ "${SCAN_ERROR}" == "true" ]]; then
            echo "> ⚠️ Trivy did not complete successfully - the results below may be incomplete."
            echo ""
          fi

          echo "| Metric | Count |"
          echo "|---|---:|"
          echo "| Reported (${SEVERITY}) | ${TOTAL_VULNERABILITY_COUNT:-0} |"
          echo "| Matching fail_on (${FAIL_ON:-none}) | ${VULNERABILITY_COUNT:-0} |"
          echo ""

          if [[ -n "${JSON_REPORT}" && -s "${JSON_REPORT}" ]] && jq -e '[.Results[]?.Vulnerabilities[]?] | length > 0' "${JSON_REPORT}" >/dev/null 2>&1; then
            echo "<details>"
            echo "<summary>Findings</summary>"
            echo ""
            echo "| Severity | ID | Package | Installed | Fixed |"
            echo "|---|---|---|---|---|"
            jq -r '
              .Results[]? |
              .Vulnerabilities[]? |
              [
                (.Severity // "UNKNOWN"),
                (.VulnerabilityID // "UNKNOWN"),
                (.PkgName // "unknown"),
                (.InstalledVersion // "unknown"),
                (.FixedVersion // "—")
              ] |
              "| " + join(" | ") + " |"
            ' "${JSON_REPORT}" >> "${SUMMARY}"
            echo "" >> "${SUMMARY}"
            echo "</details>" >> "${SUMMARY}"
          else
            echo "No vulnerabilities found."
          fi
        } > "${SUMMARY}"

        echo "summary=${SUMMARY}" >> "${GITHUB_OUTPUT}"

    # ============================================================
    # Post PR comment
    #
    # Upserts one comment per image (matched via a marker that
    # includes the image reference, so scanning several images in
    # one PR gets one comment each rather than overwriting).
    # ============================================================
    - id: pr-comment
      name: Post scan summary to pull request
      if: always() && inputs.post_pr_comment == 'true'
      uses: ${{ github.action_repository }}/post-comment@${{ github.action_ref }}
      with:
        body_path: ${{ steps.build-summary.outputs.summary }}
        marker: "<!-- trivy-container-scan:${{ inputs.image }} -->"