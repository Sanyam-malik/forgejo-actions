name: Docker Image Build
description: Build a single-platform Docker image to an OCI tar archive, without pushing it

inputs:
  registry:
    description: Registry URL
    required: true

  namespace:
    description: Registry namespace
    required: true

  image:
    description: Image name
    required: true

  tag:
    description: Image tag
    required: false
    default: latest

  build_args:
    description: Additional docker build arguments (e.g. --build-arg FOO=bar)
    required: false
    default: ""

outputs:
  image:
    description: Full image reference
    value: ${{ steps.build.outputs.image }}

runs:
  using: composite

  steps:
    - id: build
      name: Build Docker image
      shell: bash
      env:
        REGISTRY_INPUT: ${{ inputs.registry }}
        NAMESPACE_INPUT: ${{ inputs.namespace }}
        IMAGE_INPUT: ${{ inputs.image }}
        TAG: ${{ inputs.tag }}
        BUILD_ARGS: ${{ inputs.build_args }}
      run: |
        set -euo pipefail

        # ------------------------------------------------------------
        # Normalize registry
        # ------------------------------------------------------------
        REGISTRY="${REGISTRY_INPUT}"
        REGISTRY="${REGISTRY#http://}"
        REGISTRY="${REGISTRY#https://}"
        REGISTRY="${REGISTRY%/}"

        NAMESPACE="${NAMESPACE_INPUT}"
        NAMESPACE="${NAMESPACE#/}"
        NAMESPACE="${NAMESPACE%/}"

        IMAGE_NAME="${IMAGE_INPUT}"
        IMAGE_NAME="${IMAGE_NAME#/}"
        IMAGE_NAME="${IMAGE_NAME%/}"

        # ------------------------------------------------------------
        # Validate inputs
        # ------------------------------------------------------------
        if [[ -z "${REGISTRY}" ]]; then
          echo "::error::registry input is empty"
          exit 1
        fi

        if [[ -z "${NAMESPACE}" ]]; then
          echo "::error::namespace input is empty"
          exit 1
        fi

        if [[ -z "${IMAGE_NAME}" ]]; then
          echo "::error::image input is empty"
          exit 1
        fi

        if [[ -z "${TAG}" ]]; then
          echo "::error::tag input is empty"
          exit 1
        fi

        # ------------------------------------------------------------
        # Build image reference
        # ------------------------------------------------------------
        IMAGE_REF="${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}:${TAG}"

        echo "============================================================"
        echo "Docker OCI Export"
        echo "============================================================"
        echo "Image reference:"
        echo "  ${IMAGE_REF}"

        # ------------------------------------------------------------
        # Derive OCI tarball filename from image reference
        #
        # Example:
        #   ghcr.io/my-org/my-app:1.2.3
        #
        # becomes:
        #   ghcr.io_my-org_my-app_1.2.3.oci.tar
        # ------------------------------------------------------------
        OCI_FILENAME="$(
          printf '%s' "${IMAGE_REF}" |
            sed 's#[/:@]#_#g'
        ).oci.tar"

        OUTPUT="${OCI_FILENAME}"

        echo ""
        echo "OCI output:"
        echo "  ${OUTPUT}"

        # ------------------------------------------------------------
        # Buildx cleanup
        #
        # The cleanup runs on both success and failure.
        # The original exit code is preserved.
        # ------------------------------------------------------------
        cleanup() {
          local exit_code=$?

          echo ""
          echo "============================================================"
          echo "Docker Buildx cleanup"
          echo "============================================================"

          if docker buildx version >/dev/null 2>&1; then
            echo "Pruning Buildx build cache..."

            docker buildx prune \
              --force \
              >/dev/null 2>&1 || \
              echo "::warning::Buildx cache cleanup failed."

            echo "Buildx cleanup completed."
          else
            echo "Docker Buildx is not available; skipping cleanup."
          fi

          exit "${exit_code}"
        }

        trap cleanup EXIT

        # ------------------------------------------------------------
        # Build and export as OCI image
        # ------------------------------------------------------------
        echo ""
        echo "Building Docker image..."

        BUILD_COMMAND=(
          docker buildx build
          --tag "${IMAGE_REF}"
          --output "type=oci,dest=${OUTPUT}"
        )

        if [[ -n "${BUILD_ARGS}" ]]; then
          # shellcheck disable=SC2206
          EXTRA_BUILD_ARGS=( ${BUILD_ARGS} )
          BUILD_COMMAND+=( "${EXTRA_BUILD_ARGS[@]}" )
        fi

        BUILD_COMMAND+=( "." )

        "${BUILD_COMMAND[@]}"

        # ------------------------------------------------------------
        # Verify output
        # ------------------------------------------------------------
        if [[ ! -f "${OUTPUT}" ]]; then
          echo "::error::OCI image tarball was not created: ${OUTPUT}"
          exit 1
        fi

        if [[ ! -s "${OUTPUT}" ]]; then
          echo "::error::OCI image tarball is empty: ${OUTPUT}"
          exit 1
        fi

        SIZE="$(
          du -h "${OUTPUT}" |
            cut -f1
        )"

        echo ""
        echo "============================================================"
        echo "OCI image created successfully"
        echo "============================================================"
        echo "Image: ${IMAGE_REF}"
        echo "File:  ${OUTPUT}"
        echo "Size:  ${SIZE}"
        echo "============================================================"

        # ------------------------------------------------------------
        # Outputs
        # ------------------------------------------------------------
        echo "image=${IMAGE_REF}" >> "${GITHUB_OUTPUT}"