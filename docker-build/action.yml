name: Docker Image Build
description: Build a single-platform Docker image to an OCI tar archive, without pushing it

inputs:
  registry:
    description: Registry URL
    required: true

  namespace:
    description: Registry namespace
    required: true

  image:
    description: Image name
    required: true

  tag:
    description: Image tag
    required: false
    default: latest

  dockerfile:
    description: Path to the Dockerfile to build
    required: false
    default: Dockerfile

  platform:
    description: Target platform (e.g. linux/amd64). Defaults to the runner's native architecture, preventing an accidental fall-through to an emulated platform.
    required: false
    default: ""

  disable_process_sandbox:
    description: >
      Create and use a dedicated buildx builder with BuildKit's
      process sandbox disabled (--oci-worker-no-process-sandbox).
      Required for tools that write out and directly execute native
      helper binaries during the build (e.g. GraalVM native-image),
      which BuildKit's default process sandbox blocks. Only enable
      this for builds that specifically need it; leave disabled for
      normal builds so they keep the default hardened sandbox.
    required: false
    default: "false"

  build_args:
    description: Additional docker build arguments (e.g. --build-arg FOO=bar)
    required: false
    default: ""

outputs:
  image:
    description: Full image reference
    value: ${{ steps.build.outputs.image }}

runs:
  using: composite

  steps:
    - id: build
      name: Build Docker image
      shell: bash
      env:
        REGISTRY_INPUT: ${{ inputs.registry }}
        NAMESPACE_INPUT: ${{ inputs.namespace }}
        IMAGE_INPUT: ${{ inputs.image }}
        TAG: ${{ inputs.tag }}
        DOCKERFILE_INPUT: ${{ inputs.dockerfile }}
        PLATFORM_INPUT: ${{ inputs.platform }}
        DISABLE_PROCESS_SANDBOX: ${{ inputs.disable_process_sandbox }}
        BUILD_ARGS: ${{ inputs.build_args }}
      run: |
        set -euo pipefail

        # ------------------------------------------------------------
        # Normalize registry
        # ------------------------------------------------------------
        REGISTRY="${REGISTRY_INPUT}"
        REGISTRY="${REGISTRY#http://}"
        REGISTRY="${REGISTRY#https://}"
        REGISTRY="${REGISTRY%/}"

        NAMESPACE="${NAMESPACE_INPUT}"
        NAMESPACE="${NAMESPACE#/}"
        NAMESPACE="${NAMESPACE%/}"

        IMAGE_NAME="${IMAGE_INPUT}"
        IMAGE_NAME="${IMAGE_NAME#/}"
        IMAGE_NAME="${IMAGE_NAME%/}"

        DOCKERFILE="${DOCKERFILE_INPUT}"

        # ------------------------------------------------------------
        # Resolve target platform
        #
        # If not explicitly provided, pin to the runner's real native
        # architecture. This is required: without an explicit
        # --platform, `docker buildx build` resolves a platform from
        # whatever builder is currently active. If QEMU/binfmt has been
        # registered on this host (e.g. by a prior or parallel
        # multi-arch job), the active builder can be a multi-platform
        # one that advertises emulated platforms (arm64, riscv64, etc).
        # Without pinning, buildx can silently pick one of those
        # instead of the host's real architecture, and anything that
        # needs to execute native code during the build (like GraalVM
        # native-image) will fail under emulation.
        # ------------------------------------------------------------
        PLATFORM="${PLATFORM_INPUT}"

        if [[ -z "${PLATFORM}" ]]; then
          HOST_ARCH="$(uname -m)"

          case "${HOST_ARCH}" in
            x86_64|amd64)
              PLATFORM="linux/amd64"
              ;;
            aarch64|arm64)
              PLATFORM="linux/arm64"
              ;;
            armv7l|armv7)
              PLATFORM="linux/arm/v7"
              ;;
            armv6l)
              PLATFORM="linux/arm/v6"
              ;;
            i386|i686)
              PLATFORM="linux/386"
              ;;
            ppc64le)
              PLATFORM="linux/ppc64le"
              ;;
            s390x)
              PLATFORM="linux/s390x"
              ;;
            riscv64)
              PLATFORM="linux/riscv64"
              ;;
            *)
              echo "::error::Could not map host architecture '${HOST_ARCH}' to a platform. Set the 'platform' input explicitly."
              exit 1
              ;;
          esac
        fi

        # ------------------------------------------------------------
        # Validate inputs
        # ------------------------------------------------------------
        if [[ -z "${REGISTRY}" ]]; then
          echo "::error::registry input is empty"
          exit 1
        fi

        if [[ -z "${NAMESPACE}" ]]; then
          echo "::error::namespace input is empty"
          exit 1
        fi

        if [[ -z "${IMAGE_NAME}" ]]; then
          echo "::error::image input is empty"
          exit 1
        fi

        if [[ -z "${TAG}" ]]; then
          echo "::error::tag input is empty"
          exit 1
        fi

        if [[ -z "${DOCKERFILE}" ]]; then
          echo "::error::dockerfile input is empty"
          exit 1
        fi

        if [[ ! -f "${DOCKERFILE}" ]]; then
          echo "::error::Dockerfile not found at path: ${DOCKERFILE}"
          exit 1
        fi

        # ------------------------------------------------------------
        # Build image reference
        # ------------------------------------------------------------
        IMAGE_REF="${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}:${TAG}"

        echo "============================================================"
        echo "Docker OCI Export"
        echo "============================================================"
        echo "Image reference:"
        echo "  ${IMAGE_REF}"
        echo "Dockerfile:"
        echo "  ${DOCKERFILE}"
        echo "Platform:"
        echo "  ${PLATFORM}"

        # ------------------------------------------------------------
        # Derive OCI tarball filename from image reference
        #
        # Example:
        #   ghcr.io/my-org/my-app:1.2.3
        #
        # becomes:
        #   ghcr.io_my-org_my-app_1.2.3.oci.tar
        # ------------------------------------------------------------
        OCI_FILENAME="$(
          printf '%s' "${IMAGE_REF}" |
            sed 's#[/:@]#_#g'
        ).oci.tar"

        OUTPUT="${OCI_FILENAME}"

        echo ""
        echo "OCI output:"
        echo "  ${OUTPUT}"

        # ------------------------------------------------------------
        # Optional dedicated builder with the BuildKit process sandbox
        # disabled.
        #
        # BuildKit's default OCI worker runs each RUN step's process
        # inside an additional process-level sandbox on top of normal
        # container privileges. Some tools need to write out a native
        # helper binary during the build and directly execute it (e.g.
        # GraalVM native-image, which does this to compute C struct
        # layout offsets). BuildKit's process sandbox blocks that
        # write-then-exec pattern even when the container itself has
        # ordinary permissions, producing errors like:
        #   "Unable to run '.../SomeDirectives' to compute offsets"
        #
        # --oci-worker-no-process-sandbox disables that extra sandbox
        # layer. This is a real (if narrow) reduction in build
        # isolation, so it is strictly opt-in via the
        # disable_process_sandbox input, and the dedicated builder
        # used for it is created here rather than mutating whatever
        # builder is already active, so unrelated builds are
        # unaffected.
        # ------------------------------------------------------------
        BUILDER_ARGS=()
        CREATED_BUILDER=""

        if [[ "${DISABLE_PROCESS_SANDBOX}" == "true" ]]; then
          echo ""
          echo "============================================================"
          echo "Creating dedicated builder (process sandbox disabled)"
          echo "============================================================"

          if command -v uuidgen >/dev/null 2>&1; then
            UUID="$(uuidgen)"
          elif [[ -r /proc/sys/kernel/random/uuid ]]; then
            UUID="$(cat /proc/sys/kernel/random/uuid)"
          else
            UUID="$(date +%s%N)-${RANDOM}"
          fi

          CREATED_BUILDER="no_sandbox_${UUID}"

          docker buildx create \
            --name "${CREATED_BUILDER}" \
            --driver docker-container \
            --buildkitd-flags '--oci-worker-no-process-sandbox' \
            >/dev/null

          echo "Dedicated builder created: ${CREATED_BUILDER}"

          BUILDER_ARGS=( --builder "${CREATED_BUILDER}" )
        fi

        # ------------------------------------------------------------
        # Buildx cleanup
        #
        # The cleanup runs on both success and failure.
        # The original exit code is preserved.
        # ------------------------------------------------------------
        cleanup() {
          local exit_code=$?

          echo ""
          echo "============================================================"
          echo "Docker Buildx cleanup"
          echo "============================================================"

          if [[ -n "${CREATED_BUILDER}" ]] && docker buildx inspect "${CREATED_BUILDER}" >/dev/null 2>&1; then
            echo "Removing dedicated builder: ${CREATED_BUILDER}"

            docker buildx rm \
              --force \
              "${CREATED_BUILDER}" \
              >/dev/null 2>&1 || \
              echo "::warning::Failed to remove dedicated builder: ${CREATED_BUILDER}"
          fi

          if docker buildx version >/dev/null 2>&1; then
            echo "Pruning Buildx build cache..."

            docker buildx prune \
              --force \
              >/dev/null 2>&1 || \
              echo "::warning::Buildx cache cleanup failed."

            echo "Buildx cleanup completed."
          else
            echo "Docker Buildx is not available; skipping cleanup."
          fi

          exit "${exit_code}"
        }

        trap cleanup EXIT

        # ------------------------------------------------------------
        # Parse extra build args
        #
        # BUILD_ARGS is a single string of shell-quoted tokens, e.g.:
        #   --build-arg FOO=bar --build-arg BAZ="some value"
        #
        # We use `eval` (scoped to array assignment only, not the whole
        # script) so that quoting in BUILD_ARGS is respected instead of
        # naively splitting on every whitespace character. Plain
        # `( ${BUILD_ARGS} )` word-splits on ANY whitespace, including
        # whitespace inside an unquoted value (e.g. a literal, unexpanded
        # "$(date +%s)" left over from a workflow that expected shell
        # command substitution to run inside YAML, which it does not).
        # That kind of stray whitespace silently produces extra
        # positional arguments to `docker buildx build`, which then
        # fails with a confusing "requires 1 argument" error pointing at
        # the wrong place. We fail loudly here instead.
        # ------------------------------------------------------------
        EXTRA_BUILD_ARGS=()

        if [[ -n "${BUILD_ARGS}" ]]; then
          if ! eval "EXTRA_BUILD_ARGS=(${BUILD_ARGS})" 2>/tmp/build_args_error; then
            echo "::error::Failed to parse build_args input as shell arguments."
            echo "::error::build_args was: ${BUILD_ARGS}"
            cat /tmp/build_args_error >&2 || true
            exit 1
          fi

          # Sanity check: every parsed token that looks like a value
          # (comes right after --build-arg) must not itself start with
          # "--", and every --build-arg must be followed by a value.
          # This catches cases where unquoted whitespace inside a value
          # fractured it into multiple tokens.
          for (( i=0; i<${#EXTRA_BUILD_ARGS[@]}; i++ )); do
            token="${EXTRA_BUILD_ARGS[$i]}"
            if [[ "${token}" == "--build-arg" ]]; then
              next_index=$(( i + 1 ))
              if (( next_index >= ${#EXTRA_BUILD_ARGS[@]} )); then
                echo "::error::--build-arg in build_args has no following value."
                echo "::error::build_args was: ${BUILD_ARGS}"
                exit 1
              fi
              value="${EXTRA_BUILD_ARGS[$next_index]}"
              if [[ "${value}" == --* ]]; then
                echo "::error::--build-arg appears to be followed by another flag ('${value}') instead of a KEY=VALUE pair."
                echo "::error::This usually means a value in build_args contained unquoted whitespace and got split apart."
                echo "::error::build_args was: ${BUILD_ARGS}"
                exit 1
              fi
            fi
          done
        fi

        # ------------------------------------------------------------
        # Build and export as OCI image
        # ------------------------------------------------------------
        echo ""
        echo "Building Docker image..."

        BUILD_COMMAND=(
          docker buildx build
          --tag "${IMAGE_REF}"
          --file "${DOCKERFILE}"
          --platform "${PLATFORM}"
          --output "type=oci,dest=${OUTPUT}"
        )

        if (( ${#BUILDER_ARGS[@]} > 0 )); then
          BUILD_COMMAND+=( "${BUILDER_ARGS[@]}" )
        fi

        if (( ${#EXTRA_BUILD_ARGS[@]} > 0 )); then
          BUILD_COMMAND+=( "${EXTRA_BUILD_ARGS[@]}" )
        fi

        BUILD_COMMAND+=( "." )

        "${BUILD_COMMAND[@]}"

        # ------------------------------------------------------------
        # Verify output
        # ------------------------------------------------------------
        if [[ ! -f "${OUTPUT}" ]]; then
          echo "::error::OCI image tarball was not created: ${OUTPUT}"
          exit 1
        fi

        if [[ ! -s "${OUTPUT}" ]]; then
          echo "::error::OCI image tarball is empty: ${OUTPUT}"
          exit 1
        fi

        SIZE="$(
          du -h "${OUTPUT}" |
            cut -f1
        )"

        echo ""
        echo "============================================================"
        echo "OCI image created successfully"
        echo "============================================================"
        echo "Image: ${IMAGE_REF}"
        echo "File:  ${OUTPUT}"
        echo "Size:  ${SIZE}"
        echo "============================================================"

        # ------------------------------------------------------------
        # Outputs
        # ------------------------------------------------------------
        echo "image=${IMAGE_REF}" >> "${GITHUB_OUTPUT}"