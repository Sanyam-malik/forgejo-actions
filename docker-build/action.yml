name: Docker Image Build
description: Build a single-platform Docker image to an OCI tar archive, without pushing it

inputs:
  registry:
    description: Registry URL
    required: true

  namespace:
    description: Registry namespace
    required: true

  image:
    description: Image name
    required: true

  tag:
    description: Image tag
    required: false
    default: latest

  dockerfile:
    description: Path to the Dockerfile to build
    required: false
    default: Dockerfile

  build_args:
    description: Additional docker build arguments (e.g. --build-arg FOO=bar)
    required: false
    default: ""

outputs:
  image:
    description: Full image reference
    value: ${{ steps.build.outputs.image }}

runs:
  using: composite

  steps:
    - id: build
      name: Build Docker image
      shell: bash
      env:
        REGISTRY_INPUT: ${{ inputs.registry }}
        NAMESPACE_INPUT: ${{ inputs.namespace }}
        IMAGE_INPUT: ${{ inputs.image }}
        TAG: ${{ inputs.tag }}
        DOCKERFILE_INPUT: ${{ inputs.dockerfile }}
        BUILD_ARGS: ${{ inputs.build_args }}
      run: |
        set -euo pipefail

        # ------------------------------------------------------------
        # Normalize registry
        # ------------------------------------------------------------
        REGISTRY="${REGISTRY_INPUT}"
        REGISTRY="${REGISTRY#http://}"
        REGISTRY="${REGISTRY#https://}"
        REGISTRY="${REGISTRY%/}"

        NAMESPACE="${NAMESPACE_INPUT}"
        NAMESPACE="${NAMESPACE#/}"
        NAMESPACE="${NAMESPACE%/}"

        IMAGE_NAME="${IMAGE_INPUT}"
        IMAGE_NAME="${IMAGE_NAME#/}"
        IMAGE_NAME="${IMAGE_NAME%/}"

        DOCKERFILE="${DOCKERFILE_INPUT}"

        # ------------------------------------------------------------
        # Validate inputs
        # ------------------------------------------------------------
        if [[ -z "${REGISTRY}" ]]; then
          echo "::error::registry input is empty"
          exit 1
        fi

        if [[ -z "${NAMESPACE}" ]]; then
          echo "::error::namespace input is empty"
          exit 1
        fi

        if [[ -z "${IMAGE_NAME}" ]]; then
          echo "::error::image input is empty"
          exit 1
        fi

        if [[ -z "${TAG}" ]]; then
          echo "::error::tag input is empty"
          exit 1
        fi

        if [[ -z "${DOCKERFILE}" ]]; then
          echo "::error::dockerfile input is empty"
          exit 1
        fi

        if [[ ! -f "${DOCKERFILE}" ]]; then
          echo "::error::Dockerfile not found at path: ${DOCKERFILE}"
          exit 1
        fi

        # ------------------------------------------------------------
        # Build image reference
        # ------------------------------------------------------------
        IMAGE_REF="${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}:${TAG}"

        echo "============================================================"
        echo "Docker OCI Export"
        echo "============================================================"
        echo "Image reference:"
        echo "  ${IMAGE_REF}"
        echo "Dockerfile:"
        echo "  ${DOCKERFILE}"

        # ------------------------------------------------------------
        # Derive OCI tarball filename from image reference
        #
        # Example:
        #   ghcr.io/my-org/my-app:1.2.3
        #
        # becomes:
        #   ghcr.io_my-org_my-app_1.2.3.oci.tar
        # ------------------------------------------------------------
        OCI_FILENAME="$(
          printf '%s' "${IMAGE_REF}" |
            sed 's#[/:@]#_#g'
        ).oci.tar"

        OUTPUT="${OCI_FILENAME}"

        echo ""
        echo "OCI output:"
        echo "  ${OUTPUT}"

        # ------------------------------------------------------------
        # Buildx cleanup
        #
        # The cleanup runs on both success and failure.
        # The original exit code is preserved.
        # ------------------------------------------------------------
        cleanup() {
          local exit_code=$?

          echo ""
          echo "============================================================"
          echo "Docker Buildx cleanup"
          echo "============================================================"

          if docker buildx version >/dev/null 2>&1; then
            echo "Pruning Buildx build cache..."

            docker buildx prune \
              --force \
              >/dev/null 2>&1 || \
              echo "::warning::Buildx cache cleanup failed."

            echo "Buildx cleanup completed."
          else
            echo "Docker Buildx is not available; skipping cleanup."
          fi

          exit "${exit_code}"
        }

        trap cleanup EXIT

        # ------------------------------------------------------------
        # Parse extra build args
        #
        # BUILD_ARGS is a single string of shell-quoted tokens, e.g.:
        #   --build-arg FOO=bar --build-arg BAZ="some value"
        #
        # We use `eval` (scoped to array assignment only, not the whole
        # script) so that quoting in BUILD_ARGS is respected instead of
        # naively splitting on every whitespace character. Plain
        # `( ${BUILD_ARGS} )` word-splits on ANY whitespace, including
        # whitespace inside an unquoted value (e.g. a literal, unexpanded
        # "$(date +%s)" left over from a workflow that expected shell
        # command substitution to run inside YAML, which it does not).
        # That kind of stray whitespace silently produces extra
        # positional arguments to `docker buildx build`, which then
        # fails with a confusing "requires 1 argument" error pointing at
        # the wrong place. We fail loudly here instead.
        # ------------------------------------------------------------
        EXTRA_BUILD_ARGS=()

        if [[ -n "${BUILD_ARGS}" ]]; then
          if ! eval "EXTRA_BUILD_ARGS=(${BUILD_ARGS})" 2>/tmp/build_args_error; then
            echo "::error::Failed to parse build_args input as shell arguments."
            echo "::error::build_args was: ${BUILD_ARGS}"
            cat /tmp/build_args_error >&2 || true
            exit 1
          fi

          # Sanity check: every parsed token that looks like a value
          # (comes right after --build-arg) must not itself start with
          # "--", and every --build-arg must be followed by a value.
          # This catches cases where unquoted whitespace inside a value
          # fractured it into multiple tokens.
          for (( i=0; i<${#EXTRA_BUILD_ARGS[@]}; i++ )); do
            token="${EXTRA_BUILD_ARGS[$i]}"
            if [[ "${token}" == "--build-arg" ]]; then
              next_index=$(( i + 1 ))
              if (( next_index >= ${#EXTRA_BUILD_ARGS[@]} )); then
                echo "::error::--build-arg in build_args has no following value."
                echo "::error::build_args was: ${BUILD_ARGS}"
                exit 1
              fi
              value="${EXTRA_BUILD_ARGS[$next_index]}"
              if [[ "${value}" == --* ]]; then
                echo "::error::--build-arg appears to be followed by another flag ('${value}') instead of a KEY=VALUE pair."
                echo "::error::This usually means a value in build_args contained unquoted whitespace and got split apart."
                echo "::error::build_args was: ${BUILD_ARGS}"
                exit 1
              fi
            fi
          done
        fi

        # ------------------------------------------------------------
        # Build and export as OCI image
        # ------------------------------------------------------------
        echo ""
        echo "Building Docker image..."

        BUILD_COMMAND=(
          docker buildx build
          --tag "${IMAGE_REF}"
          --file "${DOCKERFILE}"
          --output "type=oci,dest=${OUTPUT}"
        )

        if (( ${#EXTRA_BUILD_ARGS[@]} > 0 )); then
          BUILD_COMMAND+=( "${EXTRA_BUILD_ARGS[@]}" )
        fi

        BUILD_COMMAND+=( "." )

        "${BUILD_COMMAND[@]}"

        # ------------------------------------------------------------
        # Verify output
        # ------------------------------------------------------------
        if [[ ! -f "${OUTPUT}" ]]; then
          echo "::error::OCI image tarball was not created: ${OUTPUT}"
          exit 1
        fi

        if [[ ! -s "${OUTPUT}" ]]; then
          echo "::error::OCI image tarball is empty: ${OUTPUT}"
          exit 1
        fi

        SIZE="$(
          du -h "${OUTPUT}" |
            cut -f1
        )"

        echo ""
        echo "============================================================"
        echo "OCI image created successfully"
        echo "============================================================"
        echo "Image: ${IMAGE_REF}"
        echo "File:  ${OUTPUT}"
        echo "Size:  ${SIZE}"
        echo "============================================================"

        # ------------------------------------------------------------
        # Outputs
        # ------------------------------------------------------------
        echo "image=${IMAGE_REF}" >> "${GITHUB_OUTPUT}"