name: Get Tag
description: Fetch a specified tag, or the latest tag by default, from a GitHub, GitLab, Gitea, Forgejo, or OneDev repository

inputs:
  repo_url:
    description: Repository clone URL
    required: true
  version:
    description: Tag to fetch, or latest
    required: false
    default: latest
  token:
    description: Optional token for private repositories
    required: false
    default: ""
  provider:
    description: Optional provider override (github, gitlab, gitea, forgejo, or onedev)
    required: false
    default: ""

outputs:
  tag:
    description: Selected tag
    value: ${{ steps.get_tag.outputs.tag }}

runs:
  using: composite
  steps:
    - id: get_tag
      name: Resolve tag
      shell: bash
      env:
        REPO_URL_INPUT: ${{ inputs.repo_url }}
        VERSION_INPUT: ${{ inputs.version }}
        TOKEN_INPUT: ${{ inputs.token }}
        PROVIDER_INPUT: ${{ inputs.provider }}
      run: |
        set -euo pipefail
        bash "${{ github.action_path }}/scripts/get-tag.sh"
