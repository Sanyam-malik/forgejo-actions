name: Get Release
description: Fetch a selected release tag and assets, or the latest release by default, across common Git hosting providers

inputs:
  repo:
    description: Repository URL
    required: true
  version:
    description: Release/tag version to fetch, or latest
    required: false
    default: latest
  api_url:
    description: Optional API base URL override
    required: false
    default: ""
  provider:
    description: Optional provider override (github, gitlab, gitea, forgejo, or onedev)
    required: false
    default: ""
  token:
    description: Optional API/git token for private repositories
    required: false
    default: ""

outputs:
  tag:
    description: Selected release tag
    value: ${{ steps.release.outputs.tag }}
  assets:
    description: JSON array of release assets with name, size, and URL
    value: ${{ steps.release.outputs.assets }}

runs:
  using: composite
  steps:
    - id: release
      name: Resolve release
      shell: bash
      env:
        REPO_INPUT: ${{ inputs.repo }}
        REPO_URL_INPUT: ${{ inputs.repo }}
        VERSION_INPUT: ${{ inputs.version }}
        API_URL_INPUT: ${{ inputs.api_url }}
        PROVIDER_INPUT: ${{ inputs.provider }}
        TOKEN_INPUT: ${{ inputs.token }}
        PKG_CACHE: ${{ env.PKG_CACHE }}
      run: |
        set -euo pipefail
        bash "${{ github.action_path }}/scripts/get-release.sh"
