name: Detect Package Cache
description: Detect package cache hostname from server URL (compatibility utility)

inputs:
  server_url:
    description: Server URL used to derive cache domain
    required: false
    default: ${{ github.server_url }}

outputs:
  pkg_cache:
    description: Package cache hostname
    value: ${{ steps.detect.outputs.pkg_cache }}

runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      env:
        SERVER_URL: ${{ inputs.server_url }}
      run: |
        set -euo pipefail

        DOMAIN="${SERVER_URL#https://}"
        DOMAIN="${DOMAIN#http://}"
        DOMAIN="${DOMAIN%%/*}"
        DOMAIN="${DOMAIN%%:*}"

        if [[ "$DOMAIN" == *.* ]]; then
          ROOT_DOMAIN="$(printf '%s\n' "$DOMAIN" | awk -F. '{print $(NF-1)"."$NF}')"
        else
          ROOT_DOMAIN="$DOMAIN"
        fi
        PKG_CACHE="pkg-cache.${ROOT_DOMAIN}"

        echo "pkg_cache=$PKG_CACHE" >> "$GITHUB_OUTPUT"

        echo "Detected pkg-cache: $PKG_CACHE"