name: Setup Gradle
description: Install Gradle using the inherited PKG_CACHE mirror when set

inputs:
  gradle_version:
    description: Gradle version (use 'latest' for current release)
    required: false
    default: latest

outputs:
  gradle_version:
    description: Installed Gradle version
    value: ${{ steps.install.outputs.gradle_version }}

runs:
  using: composite
  steps:
    - id: install
      name: Install Gradle
      shell: bash
      env:
        GRADLE_VERSION: ${{ inputs.gradle_version }}
        PKG_CACHE: ${{ env.PKG_CACHE }}
      run: |
        set -euo pipefail

        PKG_CACHE="${PKG_CACHE:-}"
        VERSION="${GRADLE_VERSION}"

        if [ -n "$PKG_CACHE" ]; then
          PKG_CACHE_BASE="$PKG_CACHE"
          case "$PKG_CACHE_BASE" in
            http://*|https://*) ;;
            *) PKG_CACHE_BASE="https://$PKG_CACHE_BASE" ;;
          esac
          PKG_CACHE_BASE="${PKG_CACHE_BASE%/}"

          BASE_URL="${PKG_CACHE_BASE}/services.gradle.org"
          echo "Using pkg-cache mirror: $BASE_URL"
        else
          BASE_URL="https://services.gradle.org"
          echo "Using official Gradle distribution: $BASE_URL"
        fi

        if [ "$VERSION" = "latest" ]; then
          JSON=$(curl -fsSL --retry 5 --retry-delay 5 "${BASE_URL}/versions/current")
          VERSION=$(printf '%s\n' "$JSON" |
            sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' |
            head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Could not determine the latest Gradle version"
            exit 1
          fi
        fi

        DOWNLOAD_URL="${BASE_URL}/distributions/gradle-${VERSION}-bin.zip"

        echo "Installing Gradle $VERSION"
        echo "Download URL: $DOWNLOAD_URL"

        curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
          -o gradle.zip \
          "$DOWNLOAD_URL"

        unzip -q gradle.zip
        mv "gradle-${VERSION}" "$HOME/.gradle-dist"

        echo "gradle_version=$VERSION" >> "$GITHUB_OUTPUT"

        export GRADLE_HOME="$HOME/.gradle-dist"
        echo "GRADLE_HOME=$GRADLE_HOME" >> "$GITHUB_ENV"
        echo "PATH=$GRADLE_HOME/bin:$PATH" >> "$GITHUB_ENV"
        export PATH="$GRADLE_HOME/bin:$PATH"

        echo "Gradle installed at: $GRADLE_HOME/bin/gradle"
        echo "Detected gradle path: $(command -v gradle)"

        gradle -v
