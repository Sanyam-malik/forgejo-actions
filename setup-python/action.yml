name: Setup Python
description: Install a prebuilt Python distribution from actions/python-versions

inputs:
  python_version:
    description: Python version to install (for example 3, 3.11, 3.12, 3.12.7)
    required: false
    default: "3"

runs:
  using: composite
  steps:
    - name: Install Python
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python_version }}
        PKG_CACHE: ${{ env.PKG_CACHE }}
      run: |
        set -euo pipefail

        if ! [[ "$PYTHON_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
          echo "Invalid Python version: $PYTHON_VERSION"
          echo "Expected format: 3, 3.11, 3.12, or 3.12.7"
          exit 1
        fi

        VERSION_PARTS="${PYTHON_VERSION//[^.]}"
        if [ "${#VERSION_PARTS}" -eq 0 ]; then
          PYTHON_CANDIDATES=(python3 /usr/bin/python3 /usr/local/bin/python3 python /usr/bin/python /usr/local/bin/python)
        elif [ "${#VERSION_PARTS}" -eq 1 ]; then
          PYTHON_CANDIDATES=("python${PYTHON_VERSION}" "/usr/bin/python${PYTHON_VERSION}" "/usr/local/bin/python${PYTHON_VERSION}" python3 /usr/bin/python3 /usr/local/bin/python3 python /usr/bin/python /usr/local/bin/python)
        else
          PYTHON_CANDIDATES=("python${PYTHON_VERSION%.*}" "/usr/bin/python${PYTHON_VERSION%.*}" "/usr/local/bin/python${PYTHON_VERSION%.*}" python3 /usr/bin/python3 /usr/local/bin/python3 python /usr/bin/python /usr/local/bin/python)
        fi

        matches_requested_version() {
          local version="$1"
          if [ "${#VERSION_PARTS}" -eq 2 ]; then
            [[ "$version" == "$PYTHON_VERSION" ]]
          elif [ "${#VERSION_PARTS}" -eq 1 ]; then
            [[ "$version" == "$PYTHON_VERSION".* ]]
          else
            [[ "$version" == "$PYTHON_VERSION".* ]]
          fi
        }

        for candidate in "${PYTHON_CANDIDATES[@]}"; do
          if [ ! -x "$candidate" ] && ! command -v "$candidate" >/dev/null 2>&1; then
            continue
          fi

          if [[ "$candidate" = /* ]]; then
            candidate_path="$candidate"
          else
            candidate_path="$(command -v "$candidate")"
          fi
          candidate_version="$("$candidate_path" --version 2>&1 | sed -nE 's/^Python ([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p')"
          if [[ -n "$candidate_version" ]] && matches_requested_version "$candidate_version"; then
            PYTHON_BIN="$(readlink -f "$candidate_path")"
            PYTHON_HOME="$(dirname "$(dirname "$PYTHON_BIN")")"
            echo "Python $candidate_version already installed at $PYTHON_BIN"
            echo "PYTHON_HOME=$PYTHON_HOME" >> "$GITHUB_ENV"
            echo "$PYTHON_HOME/bin" >> "$GITHUB_PATH"
            echo "PATH=$PYTHON_HOME/bin:$PATH" >> "$GITHUB_ENV"
            echo "Python executable: $PYTHON_BIN"
            echo "PYTHON_HOME: $PYTHON_HOME"
            "$PYTHON_BIN" --version
            exit 0
          fi
        done

        for command in curl tar; do
          if ! command -v "$command" >/dev/null 2>&1; then
            echo "Required archive tool not found: $command"
            echo "Install the required archive tools on the runner before using setup-python."
            exit 1
          fi
        done

        PKG_CACHE="${PKG_CACHE:-}"
        if [ -n "$PKG_CACHE" ]; then
          PKG_CACHE_BASE="$PKG_CACHE"
          case "$PKG_CACHE_BASE" in
            http://*|https://*) ;;
            *) PKG_CACHE_BASE="https://$PKG_CACHE_BASE" ;;
          esac
          PKG_CACHE_BASE="${PKG_CACHE_BASE%/}"
          PYTHON_BASE_URL="${PKG_CACHE_BASE}/github.com/actions/python-versions/releases/download"
          PYTHON_API_URL="${PKG_CACHE_BASE}/api.github.com/repos/actions/python-versions/releases?per_page=100"
          echo "Using pkg-cache mirror for actions/python-versions: $PYTHON_BASE_URL"
        else
          PYTHON_BASE_URL="https://github.com/actions/python-versions/releases/download"
          PYTHON_API_URL="https://api.github.com/repos/actions/python-versions/releases?per_page=100"
          echo "Using actions/python-versions prebuilt distributions"
        fi

        if [ "${#VERSION_PARTS}" -eq 2 ]; then
          VERSION_PATTERN="^${PYTHON_VERSION//./\\.}-[0-9]+$"
        elif [ "${#VERSION_PARTS}" -eq 1 ]; then
          VERSION_PATTERN="^${PYTHON_VERSION//./\\.}\\.[0-9]+-[0-9]+$"
        else
          VERSION_PATTERN="^${PYTHON_VERSION//./\\.}\\.[0-9]+\\.[0-9]+-[0-9]+$"
        fi

        RELEASE_TAG="$(
          curl --fail --location --silent --show-error \
            "$PYTHON_API_URL" |
            sed -nE 's/.*"tag_name": "([^"]+)".*/\1/p' |
            grep -E "$VERSION_PATTERN" |
            sort -V |
            tail -n 1
        )"
        if [ -z "$RELEASE_TAG" ]; then
          echo "Could not find a prebuilt Python release matching: $PYTHON_VERSION"
          exit 1
        fi

        RESOLVED_VERSION="${RELEASE_TAG%-*}"
        ARCH="$(uname -m)"
        case "$ARCH" in
          x86_64) ARCH="x64" ;;
          aarch64|arm64) ARCH="arm64" ;;
          *)
            echo "Unsupported architecture: $(uname -m)"
            exit 1
            ;;
        esac

        if [ "$(id -u)" -eq 0 ] && [ -d /usr/local ] && [ -w /usr/local ]; then
          PYTHON_HOME="/usr/local/python/$RESOLVED_VERSION"
          echo "Running as root; installing Python system-wide at $PYTHON_HOME"
        else
          PYTHON_HOME="$HOME/.python/$RESOLVED_VERSION"
        fi
        PYTHON_ARCHIVE="$(mktemp)"
        trap 'rm -f "$PYTHON_ARCHIVE"' EXIT

        ASSET_NAME="python-${RESOLVED_VERSION}-linux-22.04-${ARCH}.tar.gz"
        DOWNLOAD_URL="${PYTHON_BASE_URL}/${RELEASE_TAG}/${ASSET_NAME}"
        echo "Downloading $DOWNLOAD_URL"
        curl --fail --location --retry 5 --retry-delay 5 \
          --silent --show-error "$DOWNLOAD_URL" --output "$PYTHON_ARCHIVE"

        mkdir -p "$PYTHON_HOME"
        tar --extract --gzip --file "$PYTHON_ARCHIVE" --directory "$PYTHON_HOME"
        PYTHON_BIN="$PYTHON_HOME/bin/python${RESOLVED_VERSION%.*}"
        if [ ! -x "$PYTHON_BIN" ]; then
          echo "Python executable was not found in the downloaded archive: $PYTHON_BIN"
          exit 1
        fi

        echo "PYTHON_HOME=$PYTHON_HOME" >> "$GITHUB_ENV"
        echo "$PYTHON_HOME/bin" >> "$GITHUB_PATH"
        echo "PATH=$PYTHON_HOME/bin:$PATH" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$PYTHON_HOME/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
        export PATH="$PYTHON_HOME/bin:$PATH"
        export LD_LIBRARY_PATH="$PYTHON_HOME/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

        echo "Python installed successfully"
        echo "Requested version: $PYTHON_VERSION (resolved to $RESOLVED_VERSION)"
        echo "Python executable: $PYTHON_BIN"
        echo "PYTHON_HOME: $PYTHON_HOME"

        "$PYTHON_BIN" --version